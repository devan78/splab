  {id:"alt_recycled_rubber",n:"Recycled Rubber",d:"The other half of the loop. Pairs with Recycled Plastic."},
  {id:"alt_fine_concrete",n:"Fine Concrete",d:"Silica-bound concrete: 30 limestone and 7.5 silica to 25 concrete."},
  {id:"buy_storage",n:"Storage Expansion",d:"+250 buffer on every solid item, +500 on every fluid.",repeat:10}
];
const OC_EXP = 1.321928; /* power scales with clock^log2(2.5) */
</script>

<script>
"use strict";
/* ============================================================
   STATE + SIMULATION
   ============================================================ */
const NODE_BY_ID = {};
NODES.forEach(function(n){ NODE_BY_ID[n.id]=n; });
const SECTOR_BY_ID = {};
SECTORS.forEach(function(x){ SECTOR_BY_ID[x.id]=x; });

const START_MACH = ["smelter","constructor","miner_mk1","biomass_burner"];
const START_REC  = ["iron_ingot","copper_ingot","iron_plate","iron_rod","screw","wire","cable",
                    "concrete","biomass_leaves"];

const SAVE_KEY = "pocket_foundry_v1";
/* The hub's own reserve. Small enough that it powers nothing useful on its own,
   large enough that a grid which has run out of fuel or water can always claw back. */
const HUB_MW = 5;
const OFFLINE_CAP = 4*3600;   /* four hours of catch-up */

function freshState(){
  const S = {
    v:2, t:Date.now(),
    inv:{leaves:250, iron_ore:30},
    nodes:{ iron_1:{m:"miner_mk1",clk:1} },
    found:{}, scan:{}, survey:null, seen:{},
    groups:{ iron_ingot:{c:1,clk:1,on:1}, iron_rod:{c:1,clk:1,on:1} },
    gens:{ biomass_burner:{c:1,f:"leaves"} },
    water:0,
    sink:{c:0,item:"iron_plate"},
    store:0,
    done:{}, mdep:{}, pdep:{},
    un:{mach:{},rec:{},node:{},feat:{}},
    phase:0, pts:0, vouch:0, vbought:0, cat:{}, tut:0,
    stats:{playT:0, tapped:0, sunk:0}
  };
  START_MACH.forEach(function(m){ S.un.mach[m]=1; });
  START_REC.forEach(function(r){ S.un.rec[r]=1; });
  NODES.forEach(function(n){ if(n.start){ S.found[n.id]=1; S.seen[n.res]=1; } });
  return S;
}
let S = freshState();

/* runtime, never saved */
const RT = { eff:{}, why:{}, flowIn:{}, flowOut:{}, demandMW:0, capMW:0, sat:1, load:0, genShort:{} };

/* ---------- helpers ---------- */
function solidCap(){ return 300 + 150*S.store + 250*(S.cat.buy_storage||0); }
function fluidCap(){ return 600 + 300*S.store + 500*(S.cat.buy_storage||0); }
function capOf(id){ return ITEMS[id].fl ? fluidCap() : solidCap(); }
function have(id){ return S.inv[id]||0; }
function machineOf(rid){ return MACH[RECIPES[rid].m]; }
function recUnlocked(rid){ return !!S.un.rec[rid]; }
function machUnlocked(m){ return !!S.un.mach[m]; }
function nodeUnlocked(n){ return !!S.found[n.id]; }
function sectorOpen(sec){ return maxTier() >= sec.tier; }
function sectorList(sec){ return sec.find.concat(S.un.feat.deepscan ? sec.deep : []); }
function sectorTotal(sec){ return sec.find.length + (S.un.feat.deepscan ? sec.deep.length : 0); }
function sectorFound(sec){
  let n = 0;
  sectorList(sec).forEach(function(id){ if(S.found[id]) n++; });
  return n;
}
function nextDeposit(sec){
  const list = sectorList(sec);
  for(let i=0; i<list.length; i++) if(!S.found[list[i]]) return list[i];
  return null;
}
function scanRate(){
  let r = 0;
  for(const k in S.scan) r += (MACH[k].scan||0) * (S.scan[k]||0);
  return r;
}
/* An expedition returns: the deposit goes on the map, the cache goes in the depot,
   and a resource you have never seen before teaches you how to process it. */
function completeSurvey(){
  const sv = S.survey; if(!sv) return;
  const sec = SECTOR_BY_ID[sv.sec]; if(!sec){ S.survey = null; return; }
  const id = nextDeposit(sec);
  const found = [];
  if(id){
    S.found[id] = 1;
    const res = NODE_BY_ID[id].res;
    found.push(id);
    if(!S.seen[res]){
      S.seen[res] = 1;
      (ON_FIND[res]||[]).forEach(function(r){ S.un.rec[r] = 1; });
      sv.newRes = res;
    }
  }
  for(const k in sec.cache) S.inv[k] = have(k) + sec.cache[k];
  sv.doneWith = id; sv.doneSec = sec.id;
  RT.lastFind = {sec:sec.id, node:id, res:sv.newRes||null, cache:sec.cache};
  /* keep going if the sector still has ground left and the run can be paid for */
  if(sv.repeat && nextDeposit(sec) && canAfford(sec.cost)){
    payCost(sec.cost);
    const blast = sv.blast && have("black_powder") >= BLAST_COST;
    if(blast) S.inv.black_powder = have("black_powder") - BLAST_COST;
    S.survey = {sec:sec.id, prog:0, boost: blast?2:1, blast:sv.blast, repeat:1};
  } else {
    S.survey = null;
  }
}
/* phases open the next tier band: start 1-2, p1 -> 3-4, p2 -> 5-6, p3 -> 7 */
function maxTier(){ return [2,4,6,7,8][Math.min(S.phase,4)]; }

/* per-cycle qty -> per-minute rate for one machine at 100% clock */
function ratePerMin(rid, item, side){
  const R = RECIPES[rid]; const q = (side==="in"?R.in:R.out)[item] || 0;
  return q * 60 / R.t;
}
function canAfford(cost){ for(const k in cost){ if(have(k) < cost[k]-1e-9) return false; } return true; }
function payCost(cost){ for(const k in cost){ S.inv[k] = have(k) - cost[k]; } }
/* Refunds may overfill a buffer. Clamping here would quietly destroy materials
   when you dismantle into a full stock; overfilled stock just drains normally. */
function refund(cost, mult){
  for(const k in cost){ S.inv[k] = have(k) + cost[k]*(mult===undefined?1:mult); }
}

/* ============================================================
   ONE SIMULATION STEP
   ============================================================ */
function step(dt){
  const inv = S.inv;
  const units = [];              /* every producer/consumer this tick */
  let demandMW = 0;

  /* --- miners on nodes --- */
  for(const nid in S.nodes){
    const nd = S.nodes[nid]; if(!nd || !nd.m) continue;
    const node = NODE_BY_ID[nid]; if(!node) continue;
    const M = MACH[nd.m];
    const clk = nd.clk;
    const mw = M.mw * Math.pow(clk, OC_EXP);
    demandMW += mw;
    const o = {}; o[node.res] = M.base * PURITY[node.pur] * clk;
    units.push({key:"node:"+nid, mw:mw, i:null, o:o});
  }
  /* --- water extractors --- */
  if(S.water>0){
    const M = MACH.water_extractor;
    demandMW += M.mw*S.water;
    units.push({key:"water", mw:M.mw*S.water, i:null, o:{water:M.base*S.water}});
  }
  /* --- production groups --- */
  for(const rid in S.groups){
    const G = S.groups[rid]; if(!G || !G.c) continue;
    const R = RECIPES[rid]; if(!R) continue;
    if(!G.on){ RT.eff[rid]=0; RT.why[rid]="off"; continue; }
    const M = MACH[R.m];
    const mult = G.c * G.clk;
    const mw = M.mw * G.c * Math.pow(G.clk, OC_EXP);
    demandMW += mw;
    const i={}, o={};
    for(const k in R.in)  i[k] = R.in[k]  * 60 / R.t * mult;
    for(const k in R.out) o[k] = R.out[k] * 60 / R.t * mult;
    units.push({key:rid, mw:mw, i:i, o:o});
  }
  /* --- survey stations, drawing only while an expedition is out --- */
  let scanPow = 0, rate = 0;
  if(S.survey && S.survey.sec){
    for(const k in S.scan){
      const c = S.scan[k]||0; if(!c) continue;
      scanPow += MACH[k].mw * c;
      rate += (MACH[k].scan||0) * c;
    }
    demandMW += scanPow;
  }
  RT.scanRate = rate;

  /* --- resource sinks --- */
  if(S.sink.c>0 && S.sink.item){
    const M = MACH.resource_sink;
    demandMW += M.mw*S.sink.c;
    const i={}; i[S.sink.item] = M.base*S.sink.c;
    units.push({key:"sink", mw:M.mw*S.sink.c, i:i, o:null, sink:S.sink.item});
  }

  /* --- power supply --- */
  let capMW = HUB_MW;
  const gens = [];
  RT.genShort = {};
  for(const gid in S.gens){
    const G = S.gens[gid]; if(!G || !G.c) continue;
    const M = MACH[gid];
    const f = G.f;
    const fuelOK = (inv[f]||0) > 1e-9;
    const waterOK = !M.water || (inv.water||0) > 1e-9;
    if(fuelOK && waterOK){ capMW += (-M.mw)*G.c; gens.push({M:M,f:f,c:G.c}); }
    else RT.genShort[gid] = fuelOK ? "water" : "fuel";
  }
  const sat = demandMW > 1e-9 ? Math.min(1, capMW/demandMW) : 1;
  /* generators only carry the demand the hub reserve cannot, so they idle instead of burning fuel */
  const genCap = capMW - HUB_MW;
  const load = genCap > 1e-9 ? Math.min(1, Math.max(0, demandMW - HUB_MW)/genCap) : 0;
  RT.demandMW = demandMW; RT.capMW = capMW; RT.sat = sat; RT.load = load;

  /* burn fuel proportional to grid load, and record it so net rates stay honest */
  const burned = {};
  for(let gi=0; gi<gens.length; gi++){
    const g = gens[gi];
    const burn = 60 * (-g.M.mw) / FUEL_MJ[g.f] * g.c * load;   /* units per minute */
    inv[g.f] = Math.max(0, (inv[g.f]||0) - burn*dt/60);
    burned[g.f] = (burned[g.f]||0) + burn;
    if(g.M.water){
      const w = g.M.water * g.c * load;
      inv.water = Math.max(0, (inv.water||0) - w*dt/60);
      burned.water = (burned.water||0) + w;
    }
  }

  /* --- shared input allocation --- */
  const need = {};
  for(let u=0; u<units.length; u++){
    const un = units[u]; if(!un.i) continue;
    for(const k in un.i) need[k] = (need[k]||0) + un.i[k]*sat;
  }
  const ratio = {};
  for(const k in need){
    const want = need[k]*dt/60;
    ratio[k] = want <= 1e-12 ? 1 : Math.min(1, (inv[k]||0)/want);
  }

  /* --- resolve each unit --- */
  const fin = {}, fout = {};
  for(let u=0; u<units.length; u++){
    const un = units[u];
    let rIn = 1, rOut = 1;
    if(un.i) for(const k in un.i) rIn = Math.min(rIn, ratio[k]);
    if(un.o) for(const k in un.o){
      const amt = un.o[k]*sat*dt/60;
      if(amt > 1e-12){
        const room = capOf(k) - (inv[k]||0);
        rOut = Math.min(rOut, room <= 0 ? 0 : Math.min(1, room/amt));
      }
    }
    const r = Math.min(rIn, rOut);
    const eff = r * sat;

    if(un.i) for(const k in un.i){
      const amt = un.i[k]*eff*dt/60;
      inv[k] = Math.max(0, (inv[k]||0) - amt);
      fin[k] = (fin[k]||0) + un.i[k]*eff;
      if(un.sink === k){
        S.pts += amt * ITEMS[k].p;
        S.stats.sunk += amt;
      }
    }
    if(un.o) for(const k in un.o){
      const amt = un.o[k]*eff*dt/60;
      inv[k] = Math.min(capOf(k), (inv[k]||0) + amt);
      fout[k] = (fout[k]||0) + un.o[k]*eff;
    }

    RT.eff[un.key] = eff;
    RT.why[un.key] = sat < .995 ? "pow" : rIn < .995 ? "starve" : rOut < .995 ? "full" : "run";
  }
  for(const k in burned) fin[k] = (fin[k]||0) + burned[k];
  RT.flowIn = fin; RT.flowOut = fout;

  /* survey progress, throttled by power like everything else */
  if(S.survey && S.survey.sec && rate > 0){
    const sec = SECTOR_BY_ID[S.survey.sec];
    if(sec){
      S.survey.prog += rate * (S.survey.boost||1) * sat * dt;
      if(S.survey.prog >= sec.effort) completeSurvey();
    } else S.survey = null;
  }
  S.stats.playT += dt;
}

/* run `sec` seconds of simulation in stable sub-steps */
function advance(sec){
  if(sec <= 0) return;
  const h = sec > 30 ? 1 : 0.25;
  let n = Math.ceil(sec/h);
  if(n > 20000) n = 20000;
  const d = sec/n;
  for(let i=0; i<n; i++) step(d);
}

/* ============================================================
   SAVE / LOAD
   ============================================================ */
function save(){
  S.t = Date.now();
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){}
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw) return null;
  try{
    const o = JSON.parse(raw);
    if(!o || (o.v !== 1 && o.v !== 2)) return null;
    if(o.v === 1) migrate1to2(o);
    const base = freshState();
    for(const k in base) if(!(k in o)) o[k] = base[k];
    for(const k in base.un) if(!o.un[k]) o.un[k] = base.un[k];
    if(!o.stats) o.stats = base.stats;
    return o;
  }catch(e){ return null; }
}
/* v1 handed deposits out through milestones. Carry those over so a save made
   before surveying existed keeps every deposit it had already earned. */
const LEGACY_NODE_REQ = {
  iron_3:"m_logistics", iron_4:"m_base", iron_5:"m_clearing", iron_6:"m_steel", iron_7:"m_grid",
  copper_2:"m_logistics", copper_3:"m_assembly", copper_4:"m_grid",
  lime_2:"m_logistics", lime_3:"m_clearing", lime_4:"m_steel",
  coal_1:"m_coal", coal_2:"m_coal", coal_3:"m_steel", coal_4:"m_grid", coal_5:"m_grid",
  cat_1:"m_caterium", cat_2:"m_caterium", cat_3:"m_aero",
  oil_1:"m_oil", oil_2:"m_oil", oil_3:"m_fluids"
};
function migrate1to2(o){
  o.v = 2;
  o.found = o.found || {}; o.seen = o.seen || {}; o.scan = o.scan || {}; o.survey = null;
  NODES.forEach(function(n){ if(n.start) o.found[n.id] = 1; });
  for(const id in LEGACY_NODE_REQ){
    if(o.done && o.done[LEGACY_NODE_REQ[id]] && NODE_BY_ID[id]) o.found[id] = 1;
  }
  /* anything already mined stays mined, even if its milestone changed hands */
  for(const id in (o.nodes||{})) if(NODE_BY_ID[id]) o.found[id] = 1;
  for(const id in o.found){ const n = NODE_BY_ID[id]; if(n) o.seen[n.res] = 1; }
  o.un = o.un || {}; o.un.feat = o.un.feat || {};
  if(o.done && o.done.m_base) o.un.mach = o.un.mach || {}, o.un.mach.survey_station = 1;
  if(o.done && o.done.m_grid) o.un.feat.deepscan = 1;
  if(o.done && o.done.m_clearing) o.un.feat.blasting = 1;
}
function applyOffline(){
  const gap = Math.min(OFFLINE_CAP, Math.max(0, (Date.now() - (S.t||Date.now()))/1000));
  if(gap < 45) { S.t = Date.now(); return null; }
  const before = {}; ITEM_IDS.forEach(function(i){ before[i] = have(i); });
  const p0 = S.pts;
  const found0 = Object.keys(S.found).length;
  advance(gap);
  RT.lastFind = null;                    /* the away sheet reports these, not a toast */
  S.t = Date.now();
  const newFound = Object.keys(S.found).length - found0;
  const gained = [];
  ITEM_IDS.forEach(function(i){
    const d = have(i) - before[i];
    if(d > 0.5) gained.push({id:i, d:d});
  });
  gained.sort(function(a,b){ return b.d*ITEMS[b.id].p - a.d*ITEMS[a.id].p; });
  return {sec:gap, gained:gained.slice(0,12), pts:S.pts - p0, found:newFound};
}
</script>

<script>
"use strict";
/* ============================================================
   INTERFACE
   ============================================================ */
const view = document.getElementById("view");
const main = document.getElementById("main");
let TAB = "hub";
let LIVE = [];
let uid = 0;
function nid(){ return "e"+(++uid); }
function bind(id, fn){ LIVE.push({id:id, fn:fn}); }

/* ---------- formatting ---------- */
function fmt(n){
  n = +n || 0; const a = Math.abs(n);
  if(a >= 1e6) return (n/1e6).toFixed(a>=1e7?0:1)+"M";
  if(a >= 1e4) return (n/1e3).toFixed(a>=1e5?0:1)+"k";
  if(a >= 100) return String(Math.round(n));
  return String(Math.round(n*10)/10);
}
function qty(n){ return fmt(Math.floor((+n||0)+1e-9)); }
function rt(n){ const a = Math.abs(n); return a>=100 ? String(Math.round(n)) : String(Math.round(n*10)/10); }
function mw(n){ return (Math.abs(n)>=100 ? Math.round(n) : Math.round(n*10)/10) + " MW"; }
function dur(s){
  s = Math.floor(s);
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60);
  if(h) return h+"h "+m+"m";
  if(m) return m+"m";
  return s+"s";
}
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function ico(id, sm){
  const I = ITEMS[id];
  return '<i class="ico '+I.k+(sm?" sm":"")+'" style="--c:'+I.c+'"></i>';
}
function chip(id, n){
  return '<span class="chip">'+ico(id,1)+'<span class="mono">'+qty(n)+'</span></span>';
}
function costList(cost){
  let s = '<div class="costs">';
  for(const k in cost){
    const ok = have(k) >= cost[k]-1e-9;
    s += '<span class="cost'+(ok?"":" no")+'">'+ico(k,1)+'<span class="mono">'+fmt(cost[k])+'</span> '+esc(ITEMS[k].n)+'</span>';
  }
  return s+"</div>";
}
function flowLine(rid){
  const R = RECIPES[rid]; let s = '<div class="flow">';
  let first = true;
  for(const k in R.in){
    if(!first) s += '<span class="arrow">+</span>'; first = false;
    s += '<span class="chip">'+ico(k,1)+'<span class="mono">'+rt(R.in[k]*60/R.t)+'</span></span>';
  }
  if(first) s += '<span class="sub">node feed</span>';
  s += '<span class="arrow">&rarr;</span>'; first = true;
  for(const k in R.out){
    if(!first) s += '<span class="arrow">+</span>'; first = false;
    s += '<span class="chip">'+ico(k,1)+'<span class="mono">'+rt(R.out[k]*60/R.t)+'</span></span>';
  }
  return s+'<span class="sub" style="margin-left:2px">per min</span></div>';
}
const WHY = {
  run:["RUNNING","st-run"], starve:["STARVED","st-star"], full:["BACKED UP","st-full"],
  pow:["LOW POWER","st-pow"], off:["OFFLINE","st-off"]
};

/* ---------- toast ---------- */
let toastT = 0;
function toast(msg, bad){
  const old = document.querySelector(".toast"); if(old) old.remove();
  const d = document.createElement("div");
  d.className = "toast"+(bad?" bad":""); d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastT);
  toastT = setTimeout(function(){ if(d.parentNode) d.remove(); }, 2100);
}

/* ---------- sheet ---------- */
function sheet(title, body, onOpen){
  closeSheet();
  const s = document.createElement("div");
  s.className = "scrim";
  s.innerHTML = '<div class="sheet"><div class="sheet-h"><h3>'+esc(title)+'</h3>'+
    '<span class="grow"></span><button class="btn sm" data-close="1">Close</button></div>'+
    '<div class="sheet-b">'+body+'</div></div>';
  s.addEventListener("click", function(e){
    if(e.target === s || e.target.closest("[data-close]")) closeSheet();
  });
  document.body.appendChild(s);
  if(onOpen) onOpen(s);
}
function closeSheet(){ const s = document.querySelector(".scrim"); if(s) s.remove(); }

/* ============================================================
   TAB: HUB
   ============================================================ */
function tabHub(){
  let s = "";

  /* --- ascent elevator --- */
  const ph = PHASES[S.phase];
  s += '<div class="sec"><div class="sec-head"><h2>Ascent Elevator</h2><div class="rule"></div>'+
       '<span class="note">'+(S.phase>=4?"complete":"phase "+(S.phase+1)+" of 4")+'</span></div>';
  if(!ph){
    s += '<div class="card lit"><div class="ttl" style="color:var(--grow)">Ascent Elevator Online</div>'+
         '<div class="sub" style="margin-top:5px">All four phases delivered. Project Ascent is complete '+
         'and the elevator is carrying freight off-world. Keep expanding, or start a new save from the Depot.</div></div>';
  } else {
    let done = true, rows = "";
    for(const k in ph.cost){
      const d = Math.min(ph.cost[k], S.pdep[k]||0);
      if(d < ph.cost[k]) done = false;
      const pc = Math.min(100, d/ph.cost[k]*100);
      rows += '<div style="margin-top:9px"><div class="row" style="gap:7px">'+ico(k,1)+
        '<span class="grow" style="font-size:12.5px">'+esc(ITEMS[k].n)+'</span>'+
        '<span class="mono" style="font-size:12px;color:'+(d>=ph.cost[k]?"var(--grow)":"var(--ink-2)")+'">'+
        fmt(d)+' / '+fmt(ph.cost[k])+'</span></div>'+
        '<div class="prog"><i class="'+(d>=ph.cost[k]?"done":"")+'" style="width:'+pc+'%"></i></div></div>';
    }
    const gate = ["Unlocks Tier 3 &amp; 4","Unlocks Tier 5 &amp; 6","Unlocks Tier 7","Completes the project"][S.phase];
    s += '<div class="card lit"><div class="row"><span class="ttl grow">'+esc(ph.n)+'</span>'+
         '<span class="stat '+(done?"st-run":"st-off")+'">'+(done?"READY":"IN PROGRESS")+'</span></div>'+
         '<div class="sub" style="margin-top:3px">'+gate+'</div>'+rows+
         '<button class="btn wide '+(done?"pri":"")+'" style="margin-top:11px" data-act="phase">'+
         (done?"Launch phase":"Deliver available parts")+'</button></div>';
  }
  s += "</div>";

  /* --- milestones --- */
  const mt = maxTier();
  const open = MILESTONES.filter(function(m){ return !S.done[m.id] && m.tier <= mt; });
  const locked = MILESTONES.filter(function(m){ return !S.done[m.id] && m.tier > mt; });
  s += '<div class="sec"><div class="sec-head"><h2>Hub Milestones</h2><div class="rule"></div>'+
       '<span class="note">'+Object.keys(S.done).length+' / '+MILESTONES.length+' done</span></div>';
  if(!open.length) s += '<div class="empty">Every milestone up to Tier '+mt+' is complete. Deliver the next elevator phase to open more.</div>';
  open.forEach(function(m){
    const dep = S.mdep[m.id] || {};
    let done = true, rows = "";
    for(const k in m.cost){
      const d = Math.min(m.cost[k], dep[k]||0);
      if(d < m.cost[k]) done = false;
      const pc = Math.min(100, d/m.cost[k]*100);
      rows += '<div style="margin-top:7px"><div class="row" style="gap:7px">'+ico(k,1)+
        '<span class="grow" style="font-size:12.5px">'+esc(ITEMS[k].n)+'</span>'+
        '<span class="mono" style="font-size:12px;color:'+(d>=m.cost[k]?"var(--grow)":"var(--ink-2)")+'">'+
        fmt(d)+' / '+fmt(m.cost[k])+'</span></div>'+
        '<div class="prog"><i class="'+(d>=m.cost[k]?"done":"")+'" style="width:'+pc+'%"></i></div></div>';
    }
    s += '<div class="card" data-tut="ms-'+m.id+'"><div class="row"><span class="ttl grow">'+esc(m.n)+'</span>'+
         '<span class="pill">T'+m.tier+'</span></div>'+rows+
         '<div class="tags">'+unlockTags(m.un)+'</div>'+
         '<button class="btn wide '+(done?"pri":"")+'" style="margin-top:10px" data-act="mdep" data-id="'+m.id+'">'+
         (done?"Complete milestone":"Deposit available")+'</button></div>';
  });
  if(locked.length){
    s += '<div class="card tight"><div class="lbl">Locked until the elevator advances</div><div class="tags">'+
      locked.map(function(m){ return '<span class="tag">T'+m.tier+' '+esc(m.n)+'</span>'; }).join("")+'</div></div>';
  }
  s += "</div>";

  /* --- readout --- */
  const nMach = countMachines();
  s += '<div class="sec"><div class="sec-head"><h2>Readout</h2><div class="rule"></div></div>'+
    '<div class="card tight"><div class="inv" style="grid-template-columns:repeat(auto-fill,minmax(108px,1fr))">'+
    statTile("Sink points", '<span id="stPts">'+fmt(S.pts)+'</span>')+
    statTile("Vouchers", String(S.vouch))+
    statTile("Machines", String(nMach))+
    statTile("Grid draw", '<span id="stDraw">'+mw(RT.demandMW)+'</span>')+
    statTile("Uptime", dur(S.stats.playT))+
    statTile("Tier", String(Math.min(maxTier(),8)))+
    '</div></div></div>';
  bind("stPts", function(e){ e.textContent = fmt(S.pts); });
  bind("stDraw", function(e){ e.textContent = mw(RT.demandMW); });
  return s;
}
function statTile(label, val){
  return '<div class="slot" style="display:block"><div class="lbl">'+label+'</div>'+
         '<div class="qt" style="margin-top:2px">'+val+'</div></div>';
}
const FEAT_NAME = {
  catalog:"Requisition Catalog", overclock:"Overclocking",
  blasting:"Blasting Charges", deepscan:"Deep Scan"
};
function unlockTags(list){
  return list.map(function(u){
    const p = u.split(":"), kind = p[0], id = p[1];
    if(kind === "mach") return '<span class="tag g">'+esc(MACH[id].n)+'</span>';
    if(kind === "rec")  return '<span class="tag">'+esc(RECIPES[id].n)+'</span>';
    if(kind === "node") return '<span class="tag">'+esc(ITEMS[NODE_BY_ID[id].res].n)+' node</span>';
    if(kind === "feat") return '<span class="tag g">'+esc(FEAT_NAME[id]||id)+'</span>';
    return "";
  }).join("");
}
function countMachines(){
  let n = 0;
  for(const r in S.groups) n += S.groups[r].c;
  for(const k in S.nodes) if(S.nodes[k] && S.nodes[k].m) n++;
  for(const g in S.gens) n += S.gens[g].c;
  return n + S.water + S.sink.c + S.store;
}

/* ============================================================
   TAB: MINE
   ============================================================ */
const TAP = {iron_ore:5, copper_ore:5, limestone:5, coal:5, caterium_ore:5,
             sulfur:5, raw_quartz:5, leaves:25, wood:10};
/* Anything you can mine by hand, so a grid that runs dry can always be restarted. */
function tappable(){
  const seen = {}, list = [];
  NODES.forEach(function(n){
    if(!nodeUnlocked(n) || n.res === "crude_oil" || seen[n.res]) return;
    seen[n.res] = 1; list.push(n.res);
  });
  list.push("leaves");
  if(S.done.m_clearing) list.push("wood");
  return list;
}
function tabMine(){
  let s = "";

  /* manual */
  let btns = "";
  tappable().forEach(function(i){
    btns += '<button class="btn" data-act="tap" data-id="'+i+'">'+ico(i,1)+'+'+TAP[i]+'</button>';
  });
  s += '<div class="sec"><div class="sec-head"><h2>Manual Extraction</h2><div class="rule"></div>'+
       '<span class="note">no power</span></div>'+
       '<div class="card" data-tut="manual"><div class="sub">Hand-mining bootstraps a factory and restarts a grid that has run '+
       'out of fuel: one unit is enough to bring a generator back and let the miners feed it. '+
       'It will never keep pace with a miner.</div>'+
       '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:9px">'+btns+'</div></div></div>';

  /* hand craft */
  const hc = Object.keys(RECIPES).filter(function(r){
    const R = RECIPES[r];
    return S.un.rec[r] && !R.alt && (R.m === "constructor" || R.m === "smelter");
  });
  if(hc.length){
    let rows = "";
    hc.forEach(function(r){
      const R = RECIPES[r];
      let ok = true, cst = "";
      for(const k in R.in){ if(have(k) < R.in[k]) ok = false; cst += ico(k,1)+'<span class="mono" style="font-size:11.5px">'+R.in[k]+'</span>'; }
      let got = "";
      for(const k in R.out) got += ico(k,1)+'<span class="mono" style="font-size:11.5px">'+R.out[k]+'</span>';
      rows += '<button class="pick" data-act="craft" data-id="'+r+'"'+(ok?"":" disabled")+'>'+
        '<div class="row"><span class="ttl grow" style="font-size:13.5px">'+esc(R.n)+'</span>'+
        '<span class="stat st-off">Craft</span></div>'+
        '<div class="flow">'+cst+'<span class="arrow">&rarr;</span>'+got+'</div></button>';
    });
    s += '<div class="sec"><div class="sec-head"><h2>Hand Craft</h2><div class="rule"></div>'+
         '<span class="note">one cycle per tap</span></div>'+rows+'</div>';
  }

  /* nodes */
  const byRes = {};
  NODES.forEach(function(n){ if(nodeUnlocked(n)){ (byRes[n.res] = byRes[n.res] || []).push(n); } });
  s += '<div class="sec"><div class="sec-head"><h2>Resource Nodes</h2><div class="rule"></div>'+
       '<span class="note">one miner each</span></div>';
  for(const res in byRes){
    s += '<div class="card tight"><div class="row"><span>'+ico(res)+'</span>'+
         '<span class="ttl grow" style="font-size:13.5px">'+esc(ITEMS[res].n)+'</span>'+
         '<span class="mono" style="font-size:12px;color:var(--ink-3)">'+rt(nodeYield(res))+'/m</span></div>';
    byRes[res].forEach(function(n){ s += nodeRow(n); });
    s += "</div>";
  }
  s += "</div>";

  /* water */
  if(machUnlocked("water_extractor")){
    const M = MACH.water_extractor;
    s += '<div class="sec"><div class="sec-head"><h2>Water Extraction</h2><div class="rule"></div></div>'+
      '<div class="card"><div class="row">'+ico("water")+
      '<div class="grow"><div class="ttl" style="font-size:13.5px">Water Extractor</div>'+
      '<div class="sub">'+M.base+'/min each &middot; '+mw(M.mw)+' each</div></div>'+
      stepper("water", S.water)+'</div>'+
      '<div class="sub" style="margin-top:8px">Supplying '+rt(S.water*M.base)+'/min. '+
      'A coal generator drinks 45/min, so one extractor covers 2 generators with a little to spare.</div>'+
      costList(M.cost)+'</div></div>';
  }
  /* storage */
  if(machUnlocked("storage_container")){
    s += '<div class="sec"><div class="sec-head"><h2>Storage</h2><div class="rule"></div></div>'+
      '<div class="card"><div class="row"><div class="grow"><div class="ttl" style="font-size:13.5px">Storage Container</div>'+
      '<div class="sub">+150 solid buffer, +300 fluid buffer each</div></div>'+stepper("store", S.store)+'</div>'+
      '<div class="sub" style="margin-top:8px">Buffers now hold <span class="mono">'+fmt(solidCap())+
      '</span> of each solid and <span class="mono">'+fmt(fluidCap())+'</span> of each fluid. '+
      'A full buffer backs the producer up, exactly like a full belt.</div>'+
      costList(MACH.storage_container.cost)+'</div></div>';
  }
  return s;
}
function nodeYield(res){
  let r = 0;
  for(const id in S.nodes){
    const nd = S.nodes[id]; const n = NODE_BY_ID[id];
    if(nd && nd.m && n && n.res === res) r += MACH[nd.m].base * PURITY[n.pur] * nd.clk;
  }
  return r;
}
function nodeRow(n){
  const nd = S.nodes[n.id];
  const isOil = n.res === "crude_oil";
  const tiers = isOil ? ["oil_extractor"] : ["miner_mk1","miner_mk2","miner_mk3"];
  const avail = tiers.filter(machUnlocked);
  let s = '<hr class="dash"><div class="row" style="margin-top:9px;align-items:flex-start;flex-wrap:wrap">'+
    '<span class="pur '+n.pur+'">'+n.pur+'</span><div class="grow">';
  if(nd && nd.m){
    const M = MACH[nd.m];
    const rate = M.base * PURITY[n.pur] * nd.clk;
    const key = "node:"+n.id;
    const eff = RT.eff[key] === undefined ? 1 : RT.eff[key];
    const w = WHY[RT.why[key] || "run"];
    const bid = nid();
    s += '<div class="row"><span class="ttl grow" style="font-size:13px">'+esc(M.n)+'</span>'+
         '<span class="stat '+w[1]+'" id="'+bid+'s">'+w[0]+'</span></div>'+
         '<div class="sub"><span class="mono" id="'+bid+'r">'+rt(rate*eff)+'</span> / '+rt(rate)+' per min &middot; '+
         mw(M.mw*Math.pow(nd.clk,OC_EXP))+'</div>'+
         '<div class="thru"><i class="belt" id="'+bid+'b" style="width:'+(eff*100)+'%"></i></div>';
    bind(bid+"s", function(e){
      const ww = WHY[RT.why[key] || "run"]; e.textContent = ww[0]; e.className = "stat "+ww[1];
    });
    bind(bid+"r", function(e){ e.textContent = rt(rate*(RT.eff[key]===undefined?1:RT.eff[key])); });
    bind(bid+"b", function(e){
      const ef = RT.eff[key] === undefined ? 1 : RT.eff[key];
      e.style.width = (ef*100)+"%";
      e.className = "belt"+(ef < .5 ? " bad" : ef < .95 ? " warn" : "");
    });
    s += '</div><div style="display:flex;flex-direction:column;gap:5px">';
    const up = tiers[tiers.indexOf(nd.m)+1];
    if(up && machUnlocked(up)) s += '<button class="btn sm" data-act="mup" data-id="'+n.id+'" data-m="'+up+'">Upgrade</button>';
    s += '<button class="btn sm ghost" data-act="mdel" data-id="'+n.id+'">Remove</button></div>';
    if(S.un.feat.overclock) s += clockRow("nclk", n.id, nd.clk);
  } else {
    s += '<div class="ttl" style="font-size:13px;color:var(--ink-3)">Empty node</div>'+
         '<div class="sub">'+(isOil?"120":"60")+' &times; '+PURITY[n.pur]+' base yield</div></div>'+
         '<div style="display:flex;flex-direction:column;gap:5px">';
    if(!avail.length) s += '<span class="sub">no extractor</span>';
    avail.forEach(function(m){
      const ok = canAfford(MACH[m].cost);
      s += '<button class="btn sm'+(ok?" pri":"")+'" data-act="mset" data-id="'+n.id+'" data-m="'+m+'"'+
           (ok?"":" disabled")+'>'+esc(MACH[m].n.replace("Miner ","").replace(" Extractor",""))+'</button>';
    });
    s += "</div>";
    if(avail.length && !canAfford(MACH[avail[0]].cost)) s += costList(MACH[avail[0]].cost);
  }
  return s+"</div>";
}
function clockRow(act, id, clk){
  const cid = nid();
  return '<div class="clock" style="flex-basis:100%"><span class="lbl">Clock</span>'+
    '<input type="range" id="'+cid+'" min="25" max="250" step="5" value="'+Math.round(clk*100)+'" '+
    'data-chg="'+act+'" data-id="'+id+'" aria-label="Clock speed">'+
    '<span class="mono" style="font-size:13px;min-width:52px;text-align:right">'+Math.round(clk*100)+'%</span></div>';
}
function stepper(act, val, max){
  const dis = max !== undefined && val >= max;
  return '<div class="stepper"><button data-act="'+act+'-" '+(val<=0?"disabled":"")+' aria-label="Remove one">&minus;</button>'+
    '<span class="val">'+val+'</span>'+
    '<button data-act="'+act+'+" '+(dis?"disabled":"")+' aria-label="Add one">+</button>'+
    '<button data-act="'+act+'++" '+(dis?"disabled":"")+' style="width:44px;font-size:12px" aria-label="Add ten">+10</button></div>';
}
</script>

<script>
"use strict";
/* ============================================================
   TAB: MAKE
   ============================================================ */
const MACH_ORDER = ["smelter","foundry","constructor","assembler","manufacturer","refinery"];
function recipesFor(m){
  return Object.keys(RECIPES).filter(function(r){ return RECIPES[r].m === m; });
}
function tabMake(){
  let s = "", any = false;
  MACH_ORDER.forEach(function(m){
    if(!machUnlocked(m)) return;
    any = true;
    const M = MACH[m];
    const mine = recipesFor(m).filter(function(r){ return S.groups[r] && S.groups[r].c > 0; });
    let n = 0, p = 0;
    mine.forEach(function(r){
      const G = S.groups[r];
      n += G.c; if(G.on) p += M.mw * G.c * Math.pow(G.clk, OC_EXP);
    });
    s += '<div class="sec"><div class="sec-head"><h2>'+esc(M.n)+'</h2><div class="rule"></div>'+
         '<span class="note mono">'+n+' &middot; '+mw(p)+'</span></div>';
    if(!mine.length) s += '<div class="empty">No '+esc(M.n.toLowerCase())+' running.</div>';
    mine.forEach(function(r){ s += groupCard(r); });
    const avail = recipesFor(m).filter(recUnlocked).length;
    s += '<button class="btn wide" data-act="pick" data-m="'+m+'">Add production &middot; '+avail+' recipes</button></div>';
  });
  if(!any) s += '<div class="empty">No production buildings unlocked yet.</div>';
  return s;
}
function groupCard(rid){
  const G = S.groups[rid], R = RECIPES[rid], M = MACH[R.m];
  const key = rid;
  const eff = G.on ? (RT.eff[key] === undefined ? 1 : RT.eff[key]) : 0;
  const w = WHY[G.on ? (RT.why[key] || "run") : "off"];
  const outId = Object.keys(R.out)[0];
  const maxOut = R.out[outId]*60/R.t * G.c * G.clk;
  const b = nid();
  let s = '<div class="card'+(G.on?" lit":"")+'" data-tut="grp-'+rid+'">'+
    '<div class="row" style="align-items:flex-start"><span style="padding-top:2px">'+ico(outId)+'</span>'+
    '<div class="grow"><div class="ttl">'+esc(R.n)+'</div>'+
    '<div class="sub"><span class="mono" id="'+b+'r">'+rt(maxOut*eff)+'</span> / '+rt(maxOut)+
    ' '+esc(ITEMS[outId].n.toLowerCase())+'/min</div></div>'+
    '<span class="stat '+w[1]+'" id="'+b+'s">'+w[0]+'</span></div>'+
    '<div class="thru"><i class="belt" id="'+b+'b" style="width:'+(eff*100)+'%"></i></div>'+
    flowLine(rid)+
    '<div class="row" style="margin-top:9px">'+stepper("g:"+rid, G.c)+
    '<span class="grow"></span>'+
    '<span class="mono" style="font-size:12px;color:var(--ink-3)">'+
      mw(M.mw*G.c*Math.pow(G.clk,OC_EXP))+'</span>'+
    '<button class="btn sm ghost" data-act="gtog" data-id="'+rid+'">'+(G.on?"Pause":"Resume")+'</button></div>';
  if(S.un.feat.overclock) s += clockRow("gclk", rid, G.clk);
  s += "</div>";
  bind(b+"s", function(e){
    const ww = WHY[S.groups[rid] && !S.groups[rid].on ? "off" : (RT.why[key]||"run")];
    e.textContent = ww[0]; e.className = "stat "+ww[1];
  });
  bind(b+"r", function(e){
    const ef = (S.groups[rid] && S.groups[rid].on) ? (RT.eff[key]===undefined?1:RT.eff[key]) : 0;
    e.textContent = rt(maxOut*ef);
  });
  bind(b+"b", function(e){
    const ef = (S.groups[rid] && S.groups[rid].on) ? (RT.eff[key]===undefined?1:RT.eff[key]) : 0;
    e.style.width = (ef*100)+"%";
    e.className = "belt"+(ef < .5 ? " bad" : ef < .95 ? " warn" : "");
  });
  return s;
}
function openPicker(m){
  const M = MACH[m];
  const list = recipesFor(m).filter(recUnlocked);
  let body = '<p>Each '+esc(M.n.toLowerCase())+' costs its build materials and draws <b>'+mw(M.mw)+
    '</b>. Dismantling refunds the full cost.</p>'+costList(M.cost);
  if(!list.length) body += '<div class="empty">No recipes unlocked for this building yet.</div>';
  list.forEach(function(r){
    const R = RECIPES[r];
    const running = S.groups[r] && S.groups[r].c > 0;
    const ok = canAfford(M.cost);
    body += '<button class="pick" data-act="gadd" data-id="'+r+'"'+(ok?"":" disabled")+'>'+
      '<div class="row"><span class="ttl grow" style="font-size:13.5px">'+esc(R.n)+'</span>'+
      (running?'<span class="stat st-run">'+S.groups[r].c+' RUNNING</span>':
               '<span class="stat st-off">'+(ok?"BUILD":"NEED PARTS")+'</span>')+'</div>'+
      flowLine(r)+'</button>';
  });
  sheet(M.n, body);
}

/* ============================================================
   TAB: SCAN
   ============================================================ */
const SCAN_ORDER = ["survey_station","survey_station_2"];
function tabScan(){
  let s = "";
  const rate = scanRate();

  const canSurvey = machUnlocked("survey_station");

  /* stations */
  s += '<div class="sec"><div class="sec-head"><h2>Survey Stations</h2><div class="rule"></div>'+
       '<span class="note mono">'+rt(rate)+' scan/s</span></div>';
  if(!canSurvey)
    s += '<div class="card tight"><div class="sub">Surveying opens with the <b>Base Building</b> '+
         'milestone on the Hub. Until then you are working the four deposits the drop pod landed on, '+
         'and the sectors below are only rumours.</div></div>';
  SCAN_ORDER.forEach(function(k){
    if(!machUnlocked(k)) return;
    const M = MACH[k], c = S.scan[k]||0;
    s += '<div class="card'+(c?" lit":"")+'"><div class="row"><div class="grow">'+
      '<div class="ttl" style="font-size:13.5px">'+esc(M.n)+'</div>'+
      '<div class="sub">'+M.scan+' scan/s each &middot; '+mw(M.mw)+' each, drawn only while surveying</div></div>'+
      stepper("scan:"+k, c)+'</div>'+costList(M.cost)+'</div>';
  });
  s += '</div>';

  /* expedition in flight */
  const sv = S.survey;
  if(canSurvey){
  s += '<div class="sec"><div class="sec-head"><h2>Expedition</h2><div class="rule"></div></div>';
  if(sv && SECTOR_BY_ID[sv.sec]){
    const sec = SECTOR_BY_ID[sv.sec];
    const eff = sec.effort;
    const per = rate * (sv.boost||1);
    const pc = Math.min(100, sv.prog/eff*100);
    const eta = per > 0 ? (eff - sv.prog)/per : Infinity;
    const target = nextDeposit(sec);
    s += '<div class="card lit"><div class="row"><span class="ttl grow">'+esc(sec.n)+'</span>'+
      (sv.boost > 1 ? '<span class="stat st-star">CHARGES SET</span>' :
       per > 0 ? '<span class="stat st-run">SURVEYING</span>' : '<span class="stat st-pow">NO STATION</span>')+'</div>'+
      '<div class="sub" style="margin-top:3px">'+(target ?
        "Tracing a "+esc(ITEMS[NODE_BY_ID[target].res].n.toLowerCase())+" signature" :
        "Nothing left to map here")+'</div>'+
      '<div class="prog" style="height:10px;margin-top:9px"><i id="svBar" style="width:'+pc+'%"></i></div>'+
      '<div class="row" style="margin-top:6px"><span class="sub grow mono" id="svEta">'+
        (per > 0 ? dur(eta)+" remaining" : "idle - build a survey station")+'</span>'+
      '<button class="btn sm ghost" data-act="svrepeat">Repeat '+(sv.repeat?"on":"off")+'</button>'+
      '<button class="btn sm ghost" data-act="svstop">Recall</button></div></div>';
    bind("svBar", function(e){
      const v = S.survey; if(!v) return;
      e.style.width = Math.min(100, v.prog/SECTOR_BY_ID[v.sec].effort*100)+"%";
    });
    bind("svEta", function(e){
      const v = S.survey; if(!v) return;
      const p = scanRate()*(v.boost||1);
      e.textContent = p > 0 ? dur((SECTOR_BY_ID[v.sec].effort - v.prog)/p)+" remaining"
                            : "idle - build a survey station";
    });
  } else {
    s += '<div class="empty">No expedition out. Pick a sector below and dispatch a survey.</div>';
  }
  s += '</div>';
  }

  /* sectors */
  s += '<div class="sec"><div class="sec-head"><h2>Sectors</h2><div class="rule"></div>'+
       '<span class="note">'+Object.keys(S.found).length+' deposits mapped</span></div>';
  if(!S.un.feat.deepscan)
    s += '<div class="card tight"><div class="sub">Deposits marked <span class="tag">deep</span> sit below '+
         'what a surface sweep can read. The <b>Geological Survey</b> milestone brings them into range.</div></div>';
  SECTORS.forEach(function(sec){
    const open = sectorOpen(sec);
    const total = sectorTotal(sec), got = sectorFound(sec);
    const next = nextDeposit(sec);
    const busy = !!(S.survey && S.survey.sec === sec.id);
    const hidden = sec.deep.length && !S.un.feat.deepscan;
    const chips = sec.find.concat(sec.deep).filter(function(id){ return S.found[id]; })
      .map(function(id){
        const n = NODE_BY_ID[id];
        return '<span class="chip">'+ico(n.res,1)+'<span class="pur '+n.pur+'" style="border:none;padding:0">'+n.pur+'</span></span>';
      }).join("");
    s += '<div class="card'+(busy?" lit":"")+'" data-tut="sec-'+sec.id+'"><div class="row" style="align-items:flex-start">'+
      '<div class="grow"><div class="ttl">'+esc(sec.n)+'</div>'+
      '<div class="sub">'+esc(sec.d)+'</div></div>'+
      (open ? '<span class="stat '+(next ? "st-off" : hidden ? "st-full" : "st-run")+'">'+
                (next ? got+"/"+total : hidden ? "SURFACE ONLY" : "MAPPED")+'</span>'
            : '<span class="pill">Tier '+sec.tier+'</span>')+'</div>';
    if(chips || hidden) s += '<div class="flow">'+chips+
      (hidden ? '<span class="tag">+'+sec.deep.length+' deep</span>' : '')+'</div>';
    if(open && next){
      const per = rate;
      s += '<div class="sub" style="margin-top:7px">Effort <span class="mono">'+sec.effort+
        '</span> scan &middot; '+(per>0 ? '<span class="mono">'+dur(sec.effort/per)+'</span> at your current rate'
                                       : 'no survey station built')+'</div>'+
        costList(sec.cost);
      const can = canSurvey && canAfford(sec.cost) && !S.survey && per > 0;
      s += '<div class="row" style="margin-top:9px;gap:7px">'+
        '<button class="btn grow '+(can?"pri":"")+'" data-act="dispatch" data-id="'+sec.id+'"'+
        (can?"":" disabled")+'>'+(busy ? "Surveying" :
          !canSurvey ? "Needs Base Building" :
          S.survey ? "Expedition already out" :
          per <= 0 ? "Build a survey station" :
          !canAfford(sec.cost) ? "Not enough supplies" : "Dispatch survey")+'</button>';
      if(S.un.feat.blasting){
        const ok = have("black_powder") >= BLAST_COST;
        s += '<button class="btn sm'+(S.blast?" pri":"")+'" data-act="blast"'+(ok?"":" disabled")+
          ' aria-label="Arm blasting charges" title="Spend '+BLAST_COST+' black powder to halve the effort">'+
          ico("black_powder",1)+BLAST_COST+'</button>';
      }
      s += '</div>';
      if(S.un.feat.blasting && S.blast)
        s += '<div class="sub" style="margin-top:6px;color:var(--warn)">Charges armed: the next dispatch spends '+
             BLAST_COST+' black powder and halves the effort.</div>';
    }
    s += '</div>';
  });
  s += '</div>';
  return s;
}

/* ============================================================
   TAB: POWER
   ============================================================ */
const GEN_ORDER = ["biomass_burner","coal_generator","fuel_generator"];
function tabPower(){
  const pct = RT.capMW > 0 ? Math.min(100, RT.demandMW/RT.capMW*100) : (RT.demandMW>0?100:0);
  let s = '<div class="sec"><div class="sec-head"><h2>Grid</h2><div class="rule"></div>'+
    '<span class="note">satisfaction <span class="mono" id="pwSat">'+Math.round(RT.sat*100)+'%</span></span></div>'+
    '<div class="card lit" data-tut="grid"><div class="row"><div class="grow">'+
    '<div class="lbl">Draw / Capacity</div>'+
    '<div class="ttl mono" style="font-size:19px;margin-top:2px" id="pwNum">'+
      mw(RT.demandMW)+' / '+mw(RT.capMW)+'</div></div>'+
    '<span class="stat '+(RT.sat<.995?"st-pow":"st-run")+'" id="pwState">'+
      (RT.sat<.995?"BROWNOUT":"NOMINAL")+'</span></div>'+
    '<div class="bar" style="height:12px;margin-top:9px"><i class="bar-fill stripe" id="pwBar" style="width:'+pct+'%"></i></div>'+
    '<div class="sub" style="margin-top:7px">A shortfall does not cut the grid off. Every machine slows to the '+
    'fraction of power it can get, so output falls smoothly until you add generators. The hub holds back '+
    '<span class="mono">'+HUB_MW+' MW</span> of reserve that never runs out, enough to restart a water '+
    'extractor or a miner after the fuel does.</div></div></div>';
  bind("pwSat", function(e){ e.textContent = Math.round(RT.sat*100)+"%"; });
  bind("pwNum", function(e){ e.textContent = mw(RT.demandMW)+" / "+mw(RT.capMW); });
  bind("pwState", function(e){
    const bad = RT.sat < .995;
    e.textContent = bad ? "BROWNOUT" : "NOMINAL"; e.className = "stat "+(bad?"st-pow":"st-run");
  });
  bind("pwBar", function(e){
    e.style.width = (RT.capMW>0 ? Math.min(100, RT.demandMW/RT.capMW*100) : (RT.demandMW>0?100:0))+"%";
  });

  s += '<div class="sec"><div class="sec-head"><h2>Generators</h2><div class="rule"></div></div>';
  let any = false;
  GEN_ORDER.forEach(function(g){
    if(!machUnlocked(g)) return;
    any = true;
    const M = MACH[g], G = S.gens[g] || {c:0, f:M.fuels[0]};
    const out = (-M.mw)*G.c;
    const burn = 60*(-M.mw)/FUEL_MJ[G.f]*G.c;
    const short = RT.genShort[g];
    let opts = "";
    M.fuels.forEach(function(f){
      opts += '<option value="'+f+'"'+(f===G.f?" selected":"")+'>'+esc(ITEMS[f].n)+' &middot; '+
        FUEL_MJ[f]+' MJ</option>';
    });
    s += '<div class="card'+(G.c?" lit":"")+'"><div class="row" style="align-items:flex-start">'+
      '<div class="grow"><div class="ttl">'+esc(M.n)+'</div>'+
      '<div class="sub">'+mw(-M.mw)+' each &middot; total <span class="mono">'+mw(out)+'</span></div></div>'+
      (G.c && short ? '<span class="stat st-pow">NO '+short.toUpperCase()+'</span>' : '')+'</div>'+
      '<div class="row" style="margin-top:9px;flex-wrap:wrap;gap:8px">'+stepper("gen:"+g, G.c)+
      '<select data-chg="fuel" data-id="'+g+'" class="grow" aria-label="Fuel for '+esc(M.n)+'">'+opts+'</select></div>'+
      '<div class="sub" style="margin-top:8px">Burns up to <span class="mono">'+rt(burn)+'</span> '+
      esc(ITEMS[G.f].n.toLowerCase())+'/min at full load'+
      (M.water ? ' plus <span class="mono">'+rt(M.water*G.c)+'</span> water/min' : '')+
      '. Idle generators burn less.</div>'+
      costList(M.cost)+'</div>';
  });
  if(!any) s += '<div class="empty">No generators unlocked.</div>';
  s += "</div>";

  /* fuel stock */
  const fuels = [];
  GEN_ORDER.forEach(function(g){ if(machUnlocked(g)) MACH[g].fuels.forEach(function(f){ if(fuels.indexOf(f)<0) fuels.push(f); }); });
  if(MACH.coal_generator && machUnlocked("coal_generator") && fuels.indexOf("water")<0) fuels.push("water");
  s += '<div class="sec"><div class="sec-head"><h2>Fuel Stock</h2><div class="rule"></div></div><div class="inv">'+
    fuels.map(function(f){ return slotFor(f); }).join("")+'</div></div>';
  return s;
}

/* ============================================================
   TAB: DEPOT
   ============================================================ */
function vCost(){ return Math.round(500*Math.pow(S.vbought+1, 1.8)); }
function tabDepot(){
  let s = "";

  /* sink */
  if(machUnlocked("resource_sink")){
    const M = MACH.resource_sink;
    const eff = RT.eff.sink === undefined ? 0 : RT.eff.sink;
    const thru = M.base*S.sink.c*eff;
    const ppm = thru * (ITEMS[S.sink.item] ? ITEMS[S.sink.item].p : 0);
    let opts = "";
    ITEM_IDS.forEach(function(i){
      if(ITEMS[i].fl || !ITEMS[i].p) return;
      opts += '<option value="'+i+'"'+(i===S.sink.item?" selected":"")+'>'+esc(ITEMS[i].n)+
        ' &middot; '+fmt(ITEMS[i].p)+' pts</option>';
    });
    s += '<div class="sec"><div class="sec-head"><h2>Resource Sink</h2><div class="rule"></div>'+
      '<span class="note mono" id="dpPts">'+fmt(S.pts)+' pts</span></div>'+
      '<div class="card'+(S.sink.c?" lit":"")+'"><div class="row"><div class="grow">'+
      '<div class="ttl">Resource Sink</div><div class="sub">'+M.base+'/min each &middot; '+mw(M.mw)+' each</div></div>'+
      stepper("sink", S.sink.c)+'</div>'+
      '<div class="row" style="margin-top:9px"><select data-chg="sinkitem" class="grow" aria-label="Item to sink">'+opts+'</select></div>'+
      '<div class="sub" style="margin-top:8px">Consuming <span class="mono" id="dpThru">'+rt(thru)+
      '</span>/min for <span class="mono" id="dpPpm">'+fmt(ppm)+'</span> points/min. '+
      'Sink surplus only, or you will starve your own factory.</div>'+costList(M.cost)+'</div></div>';
    bind("dpPts", function(e){ e.textContent = fmt(S.pts)+" pts"; });
    bind("dpThru", function(e){ e.textContent = rt(M.base*S.sink.c*(RT.eff.sink===undefined?0:RT.eff.sink)); });
    bind("dpPpm", function(e){
      const t = M.base*S.sink.c*(RT.eff.sink===undefined?0:RT.eff.sink);
      e.textContent = fmt(t*(ITEMS[S.sink.item]?ITEMS[S.sink.item].p:0));
    });
  }

  /* catalog */
  if(S.un.feat.catalog){
    const c = vCost();
    const canV = S.pts >= c;
    s += '<div class="sec"><div class="sec-head"><h2>Requisition Catalog</h2><div class="rule"></div>'+
      '<span class="note mono">'+S.vouch+' vouchers</span></div>'+
      '<div class="card"><div class="row"><div class="grow"><div class="ttl" style="font-size:13.5px">Redeem a voucher</div>'+
      '<div class="sub"><span class="mono" id="dpNeed">'+fmt(S.pts)+' / '+fmt(c)+'</span> sink points</div>'+
      '<div class="prog"><i id="dpNeedBar" style="width:'+Math.min(100,S.pts/c*100)+'%"></i></div></div>'+
      '<button class="btn '+(canV?"pri":"")+'" data-act="voucher"'+(canV?"":" disabled")+'>Redeem</button></div></div>';
    bind("dpNeed", function(e){ e.textContent = fmt(S.pts)+" / "+fmt(vCost()); });
    bind("dpNeedBar", function(e){ e.style.width = Math.min(100, S.pts/vCost()*100)+"%"; });
    CATALOG.forEach(function(c2){
      const owned = S.cat[c2.id] || 0;
      const max = c2.repeat || 1;
      const maxed = owned >= max;
      const ok = !maxed && S.vouch > 0;
      s += '<div class="card tight"><div class="row" style="align-items:flex-start">'+
        '<div class="grow"><div class="ttl" style="font-size:13.5px">'+esc(c2.n)+
        (c2.repeat?' <span class="mono" style="font-size:12px;color:var(--ink-3)">'+owned+'/'+max+'</span>':'')+'</div>'+
        '<div class="sub">'+c2.d+'</div></div>'+
        (maxed && !c2.repeat ? '<span class="stat st-run">OWNED</span>' :
          '<button class="btn sm '+(ok?"pri":"")+'" data-act="buy" data-id="'+c2.id+'"'+(ok?"":" disabled")+'>1 voucher</button>')+
        '</div>'+(RECIPES[c2.id] && !S.un.rec[c2.id] ? flowLine(c2.id) : "")+'</div>';
    });
    s += "</div>";
  }

  /* inventory */
  const shown = ITEM_IDS.filter(function(i){
    if(have(i) > 0.01) return true;
    for(const r in S.groups){ if(S.groups[r].c && (RECIPES[r].out[i] || RECIPES[r].in[i])) return true; }
    return !!S.un.rec[i];
  });
  s += '<div class="sec"><div class="sec-head"><h2>Inventory</h2><div class="rule"></div>'+
    '<span class="note">buffer '+fmt(solidCap())+' / '+fmt(fluidCap())+'</span></div>'+
    '<div class="inv" data-tut="inv">'+shown.map(function(i){ return slotFor(i); }).join("")+'</div></div>';

  /* system */
  s += '<div class="sec"><div class="sec-head"><h2>Save</h2><div class="rule"></div></div>'+
    '<div class="card tight"><div class="sub">Progress is stored in this browser and keeps running for up to '+
    'four hours while the page is closed. Backups, the tour and a new game all live in the menu.</div>'+
    '<button class="btn wide" data-act="menu" style="margin-top:9px">Open game menu</button></div></div>';
  return s;
}
function slotFor(i){
  const I = ITEMS[i], cap = capOf(i), n = have(i);
  const net = (RT.flowOut[i]||0) - (RT.flowIn[i]||0);
  const b = nid();
  const s = '<div class="slot">'+ico(i)+'<div class="grow" style="min-width:0">'+
    '<div class="nm">'+esc(I.n)+'</div>'+
    '<div class="qt" id="'+b+'q">'+qty(n)+'</div>'+
    '<div class="rt '+(net>0.05?"up":net<-0.05?"dn":"flat")+'" id="'+b+'n">'+
      (net>0.05?"+":"")+rt(net)+'/m</div>'+
    '<div class="capbar"><i id="'+b+'c" class="'+(n>=cap-1?"max":"")+'" style="width:'+Math.min(100,n/cap*100)+'%"></i></div>'+
    '</div></div>';
  bind(b+"q", function(e){ e.textContent = qty(have(i)); });
  bind(b+"n", function(e){
    const nt = (RT.flowOut[i]||0) - (RT.flowIn[i]||0);
    e.textContent = (nt>0.05?"+":"")+rt(nt)+"/m";
    e.className = "rt "+(nt>0.05?"up":nt<-0.05?"dn":"flat");
  });
  bind(b+"c", function(e){
    const q = have(i), cp = capOf(i);
    e.style.width = Math.min(100, q/cp*100)+"%";
    e.className = q >= cp-1 ? "max" : "";
  });
  return s;
}
</script>

<script>
"use strict";
/* ============================================================
   ACTIONS
   ============================================================ */
function adjustBuild(machId, delta, get, set){
  const M = MACH[machId];
  if(delta < 0){
    const n = Math.min(-delta, get());
    if(!n) return;
    set(get()-n);
    for(let i=0; i<n; i++) refund(M.cost);
    toast("Dismantled "+n+" "+M.n+(n>1?"s":"")+" - materials refunded");
  } else {
    let built = 0;
    for(let i=0; i<delta; i++){ if(!canAfford(M.cost)) break; payCost(M.cost); built++; }
    if(!built){ toast("Not enough materials for a "+M.n, 1); return; }
    set(get()+built);
    if(built < delta) toast("Built "+built+" of "+delta+" - out of materials");
  }
}
function groupCount(rid){ return S.groups[rid] ? S.groups[rid].c : 0; }
function setGroupCount(rid, n){
  if(n <= 0){ delete S.groups[rid]; return; }
  if(!S.groups[rid]) S.groups[rid] = {c:0, clk:1, on:1};
  S.groups[rid].c = n;
}
function handCraft(rid){
  const R = RECIPES[rid];
  for(const k in R.in) if(have(k) < R.in[k]) { toast("Missing "+ITEMS[k].n, 1); return; }
  for(const k in R.out) if(have(k) + R.out[k] > capOf(k) + 1e-9){
    toast(ITEMS[k].n+" buffer is full", 1); return;
  }
  for(const k in R.in) S.inv[k] = have(k) - R.in[k];
  for(const k in R.out) S.inv[k] = have(k) + R.out[k];
}
function depositInto(cost, store){
  let moved = 0, done = true;
  for(const k in cost){
    const remain = cost[k] - (store[k]||0);
    if(remain <= 0) continue;
    const give = Math.min(remain, Math.floor(have(k)+1e-9));
    if(give > 0){ S.inv[k] = have(k) - give; store[k] = (store[k]||0) + give; moved += give; }
    if((store[k]||0) < cost[k]) done = false;
  }
  return {moved:moved, done:done};
}
function doMilestone(mid){
  let m = null;
  for(let i=0;i<MILESTONES.length;i++) if(MILESTONES[i].id === mid) m = MILESTONES[i];
  if(!m || S.done[mid]) return;
  const store = S.mdep[mid] = S.mdep[mid] || {};
  const r = depositInto(m.cost, store);
  if(r.done){
    S.done[mid] = 1; delete S.mdep[mid];
    m.un.forEach(function(u){ const p = u.split(":"); S.un[p[0]][p[1]] = 1; });
    toast(m.n+" complete");
  } else if(r.moved) toast("Deposited "+fmt(r.moved)+" parts");
  else toast("Nothing in stock to deposit", 1);
}
function doPhase(){
  const ph = PHASES[S.phase];
  if(!ph) return;
  const r = depositInto(ph.cost, S.pdep);
  let done = true;
  for(const k in ph.cost) if((S.pdep[k]||0) < ph.cost[k]) done = false;
  if(done){
    S.phase++; S.pdep = {};
    if(S.phase >= 4) toast("Ascent Elevator complete. Project finished.");
    else toast(ph.n+" launched - Tier "+(S.phase*2+1)+" unlocked");
  } else if(r.moved) toast("Delivered "+fmt(r.moved)+" parts");
  else toast("Nothing in stock to deliver", 1);
}

/* Delegated on document, not on `view`: sheets are appended to document.body,
   so a handler bound to the view never sees the recipe picker's buttons. */
document.addEventListener("click", function(e){
  const t = e.target.closest("[data-act]");
  if(!t || t.disabled) return;
  const act = t.getAttribute("data-act");
  const id  = t.getAttribute("data-id");

  /* steppers */
  let d = 0, base = act;
  if(/\+\+$/.test(act)){ d = 10; base = act.slice(0,-2); }
  else if(/\+$/.test(act)){ d = 1; base = act.slice(0,-1); }
  else if(/-$/.test(act)){ d = -1; base = act.slice(0,-1); }
  if(d !== 0){
    if(base === "water") adjustBuild("water_extractor", d, function(){return S.water;}, function(v){S.water=v;});
    else if(base === "store") adjustBuild("storage_container", d, function(){return S.store;}, function(v){S.store=v;});
    else if(base === "sink") adjustBuild("resource_sink", d, function(){return S.sink.c;}, function(v){S.sink.c=v;});
    else if(base.indexOf("g:") === 0){
      const rid = base.slice(2);
      adjustBuild(RECIPES[rid].m, d, function(){return groupCount(rid);}, function(v){setGroupCount(rid,v);});
    }
    else if(base.indexOf("scan:") === 0){
      const k = base.slice(5);
      if(S.scan[k] === undefined) S.scan[k] = 0;
      adjustBuild(k, d, function(){return S.scan[k];}, function(v){S.scan[k]=v;});
    }
    else if(base.indexOf("gen:") === 0){
      const g = base.slice(4);
      if(!S.gens[g]) S.gens[g] = {c:0, f:MACH[g].fuels[0]};
      adjustBuild(g, d, function(){return S.gens[g].c;}, function(v){S.gens[g].c=v;});
    }
    render(); return;
  }

  switch(act){
    case "tap": {
      const n = TAP[id] || 1;
      S.inv[id] = Math.min(capOf(id), have(id) + n);
      S.stats.tapped += n;
      render(); return;
    }
    case "craft": handCraft(id); render(); return;
    case "mset": case "mup": {
      const m = t.getAttribute("data-m");
      const cur = S.nodes[id];
      if(!canAfford(MACH[m].cost)){ toast("Not enough materials for a "+MACH[m].n, 1); return; }
      payCost(MACH[m].cost);
      if(cur && cur.m) refund(MACH[cur.m].cost);
      S.nodes[id] = {m:m, clk: cur ? cur.clk : 1};
      render(); return;
    }
    case "mdel": {
      const cur = S.nodes[id];
      if(cur && cur.m) refund(MACH[cur.m].cost);
      delete S.nodes[id];
      toast("Extractor dismantled - materials refunded");
      render(); return;
    }
    case "gtog": if(S.groups[id]) S.groups[id].on = S.groups[id].on ? 0 : 1; render(); return;
    case "pick": openPicker(t.getAttribute("data-m")); return;
    case "gadd": {
      const M = RECIPES[id].m;
      adjustBuild(M, 1, function(){return groupCount(id);}, function(v){setGroupCount(id,v);});
      closeSheet(); TAB = "make"; syncTabs(); render(); return;
    }
    case "mdep": doMilestone(id); render(); return;
    case "phase": doPhase(); render(); return;
    case "voucher": {
      const c = vCost();
      if(S.pts < c){ toast("Not enough sink points", 1); return; }
      S.pts -= c; S.vouch++; S.vbought++;
      toast("Voucher redeemed");
      render(); return;
    }
    case "buy": {
      let item = null;
      for(let i=0;i<CATALOG.length;i++) if(CATALOG[i].id === id) item = CATALOG[i];
      if(!item) return;
      const owned = S.cat[id] || 0;
      if(owned >= (item.repeat || 1)){ toast("Already acquired", 1); return; }
      if(S.vouch < 1){ toast("No vouchers left", 1); return; }
      S.vouch--; S.cat[id] = owned + 1;
      if(RECIPES[id]) S.un.rec[id] = 1;
      toast(item.n+" acquired");
      render(); return;
    }
    case "dispatch": {
      const sec = SECTOR_BY_ID[id];
      if(!sec || S.survey) return;
      if(!sectorOpen(sec)){ toast("That sector is out of range", 1); return; }
      if(!nextDeposit(sec)){ toast("Nothing left to map there", 1); return; }
      if(scanRate() <= 0){ toast("Build a survey station first", 1); return; }
      if(!canAfford(sec.cost)){ toast("Not enough supplies for the expedition", 1); return; }
      payCost(sec.cost);
      let boost = 1;
      if(S.blast && S.un.feat.blasting && have("black_powder") >= BLAST_COST){
        S.inv.black_powder = have("black_powder") - BLAST_COST;
        boost = 2;
      }
      S.survey = {sec:sec.id, prog:0, boost:boost, blast:S.blast?1:0, repeat:1};
      S.blast = 0;
      toast("Expedition dispatched to "+sec.n);
      render(); return;
    }
    case "svstop": {
      if(!S.survey) return;
      const sec = SECTOR_BY_ID[S.survey.sec];
      if(sec) refund(sec.cost);          /* recall returns the supplies, not the progress */
      S.survey = null;
      toast("Expedition recalled, supplies returned");
      render(); return;
    }
    case "svrepeat": if(S.survey) S.survey.repeat = S.survey.repeat ? 0 : 1; render(); return;
    case "blast": S.blast = S.blast ? 0 : 1; render(); return;
    case "close": closeSheet(); return;
    case "help": closeSheet(); openHelp(); return;
    case "menu": openMenu(); return;
    case "tutnext": tutNext(); return;
    case "tutskip": tutStop(); toast("Tour skipped - replay it from the menu"); return;
    case "tutstart": closeSheet(); tutStart(); return;
    case "backup": openBackup(); return;
    case "reset": openReset(); return;
  }
});

/* sliders and selects */
let dragging = false;
document.addEventListener("pointerdown", function(e){
  if(e.target.matches && e.target.matches('input[type=range]')) dragging = true;
});
document.addEventListener("pointerup", function(){ dragging = false; });
document.addEventListener("input", function(e){
  const el = e.target;
  const chg = el.getAttribute && el.getAttribute("data-chg");
  if(!chg) return;
  const id = el.getAttribute("data-id");
  if(chg === "nclk" || chg === "gclk"){
    const v = (+el.value)/100;
    if(chg === "nclk" && S.nodes[id]) S.nodes[id].clk = v;
    if(chg === "gclk" && S.groups[id]) S.groups[id].clk = v;
    const lab = el.parentNode.querySelector(".mono");
    if(lab) lab.textContent = Math.round(v*100)+"%";
  }
});
document.addEventListener("change", function(e){
  const el = e.target;
  const chg = el.getAttribute && el.getAttribute("data-chg");
  if(!chg) return;
  const id = el.getAttribute("data-id");

});

    'background:var(--steel-2);color:var(--ink-2);border:1px solid var(--line);padding:8px;resize:vertical">'+esc(code)+'</textarea>'+
    '<button class="btn wide" id="bkCopy">Copy code</button>'+
    '<hr class="dash"><p>Restore from a code:</p>'+
    '<textarea id="bkIn" rows="3" placeholder="paste code" style="width:100%;font-family:JetBrains Mono,monospace;'+
    'font-size:11px;background:var(--steel-2);color:var(--ink);border:1px solid var(--line);padding:8px;resize:vertical"></textarea>'+
    '<button class="btn wide" id="bkLoad">Load code</button>',
    function(root){
      root.querySelector("#bkCopy").addEventListener("click", function(){
        const ta = root.querySelector("#bkText");
        ta.select(); ta.setSelectionRange(0, 99999);
        let ok = false;
        try{ ok = document.execCommand("copy"); }catch(err){}
        if(navigator.clipboard && !ok) navigator.clipboard.writeText(ta.value).then(function(){ toast("Code copied"); });
        else toast(ok ? "Code copied" : "Select the code and copy it", !ok);
      });
      root.querySelector("#bkLoad").addEventListener("click", function(){
        const v = root.querySelector("#bkIn").value.trim();
        if(!v) return;
        try{
          const o = JSON.parse(decodeURIComponent(atob(v)));
          if(!o || (o.v !== 1 && o.v !== 2)) throw 0;
          if(o.v === 1) migrate1to2(o);
          S = o; save(); closeSheet(); render();
          toast("Factory restored");
        }catch(err){ toast("That code could not be read", 1); }
      });
    });
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
const TABS = {hub:tabHub, mine:tabMine, make:tabMake, scan:tabScan, power:tabPower, depot:tabDepot};
function syncTabs(){
  document.querySelectorAll(".tab").forEach(function(b){
    b.setAttribute("aria-selected", b.getAttribute("data-tab") === TAB ? "true" : "false");
  });
}
document.querySelectorAll(".tab").forEach(function(b){
  b.addEventListener("click", function(){
    TAB = b.getAttribute("data-tab");
    const d = b.querySelector(".dot"); if(d) d.remove();
    syncTabs(); main.scrollTop = 0; render(true);
  });
});
function render(top){
  const sc = top ? 0 : main.scrollTop;
  LIVE = [];
  view.innerHTML = TABS[TAB]();
  const out = [];
  for(let i=0; i<LIVE.length; i++){
    const el = document.getElementById(LIVE[i].id);
    if(el) out.push({el:el, fn:LIVE[i].fn});
  }
  LIVE = out;
  main.scrollTop = sc;
  tickUI();
  if(TUT.on) tutPlace();
}
function tickUI(){
  for(let i=0; i<LIVE.length; i++) LIVE[i].fn(LIVE[i].el);
  updateHud();
  /* Clear the find BEFORE announcing it. announceFind can ask for a re-render,
     and render() calls tickUI() again - leaving it set re-enters forever. */
  if(RT.lastFind){ const f = RT.lastFind; RT.lastFind = null; announceFind(f); }
}
/* An expedition can land at any moment, including on another tab, so say so.
   This only ever sets a flag: the render happens back in the tick, never nested. */
function announceFind(f){
  const sec = SECTOR_BY_ID[f.sec];
  if(f.node){
    const n = NODE_BY_ID[f.node];
    toast((f.res ? "New resource: " : "Deposit found: ")+ITEMS[n.res].n+" ("+n.pur+") in "+sec.n);
  } else toast("Survey of "+sec.n+" returned a supply cache");
  if(TAB !== "scan"){
    const b = document.querySelector('.tab[data-tab="scan"]');
    if(b && !b.querySelector(".dot")){
      const d = document.createElement("i"); d.className = "dot"; b.appendChild(d);
    }
  }
  if(TAB === "scan" || TAB === "mine") RT.needRender = 1;
}
const hudTier = document.getElementById("hudTier");
const hudPow  = document.getElementById("hudPow");
const hudBar  = document.getElementById("hudBar");
const hudCap  = document.getElementById("hudCap");
const hudState= document.getElementById("hudState");
const hudSub  = document.getElementById("hudSub");
function updateHud(){
  const m = Math.max(RT.capMW, RT.demandMW, 1);
  hudTier.textContent = String(Math.min(maxTier(), 8));
  hudPow.textContent = mw(RT.demandMW)+" / "+mw(RT.capMW);
  hudBar.style.width = (RT.demandMW/m*100)+"%";
  hudCap.style.left = (RT.capMW/m*100)+"%";
  const brown = RT.sat < .995;
  document.body.classList.toggle("brownout", brown);
  hudState.textContent = brown ? "Brownout" : (RT.demandMW < 0.01 ? "Idle" : "Nominal");
  hudState.className = "stat "+(brown ? "st-pow" : RT.demandMW < 0.01 ? "st-off" : "st-run");
  hudBar.classList.toggle("stripe", RT.demandMW > 0.01);
  hudSub.textContent = S.phase >= 4 ? "Project Ascent complete" : "Arclight Industries";
}

addEventListener("resize", function(){ tutPlace(); });
let lastScroll = 0;
main.addEventListener("scroll", function(){ lastScroll = Date.now(); }, {passive:true});

let lastT = performance.now();
let sinceRender = 0;
setInterval(function(){
  const now = performance.now();
  let dt = (now - lastT)/1000;
  lastT = now;
  if(dt < 0) dt = 0;
  if(dt > OFFLINE_CAP) dt = OFFLINE_CAP;
  advance(dt);
  tickUI();
  tutSync();
  sinceRender += dt;
  if(RT.needRender){ RT.needRender = 0; sinceRender = 0; render(); }
  else if(sinceRender > 4 && !dragging && !TUT.on && !document.querySelector(".scrim") && Date.now()-lastScroll > 1200){
    sinceRender = 0; render();
  }
}, 200);
setInterval(save, 5000);
document.addEventListener("visibilitychange", function(){
  if(document.hidden) save();
  else { lastT = performance.now() - 1; }
});

/* ============================================================
   GUIDED TOUR
   Twelve steps over the live game - no scripted fakes, no handouts.
   The dismantle/rebuild pair works because refunds are 100%, so a new
   player learns the build controls without spending anything.
   ============================================================ */
const TUT = {on:0, i:0, ctx:{}, els:null, t0:0};

function firstGroup(){
  if(S.groups.iron_rod) return "iron_rod";
  for(const r in S.groups) if(S.groups[r].c > 0) return r;
  return null;
}
const STEPS = [
  {t:"Welcome to the foundry",
   d:"You have one miner, one smelter and one constructor. Everything here is measured "+
     "<b>per minute</b> - match the rates and the factory runs itself. About two minutes.",
   hint:"Tap next"},

  {tab:"make", skip:function(){ return !TUT.ctx.g; },
   sel:function(){ const g=TUT.ctx.g; return g?'[data-tut="grp-'+g+'"]':null; },
   t:"A machine is a rate",
   d:"Your miner pulls <b>60 iron ore a minute</b>. This card shows what goes in, what comes out, and "+
     "the bar underneath is what it is actually managing right now.",
   hint:"Tap next"},

  {tab:"make", skip:function(){ return !TUT.ctx.g; },
   sel:function(){ const g=TUT.ctx.g; return g?'[data-act="g:'+g+'-"]':null; },
   t:"Take it apart",
   d:"Tap the minus. Dismantling always refunds <b>100% of the build cost</b>, so rearranging your "+
     "factory never costs you materials - only the time it was not running.",
   hint:"Tap the minus button",
   done:function(){ const g=TUT.ctx.g; return groupCount(g) < TUT.ctx.c; }},

  {tab:"make", keepSheet:1, skip:function(){ return !TUT.ctx.g; },
   sel:function(){ const g=TUT.ctx.g; return g?'[data-act="pick"][data-m="'+RECIPES[g].m+'"]':null; },
   t:"New production lives here",
   d:"That machine is gone from the list and its parts are back in your depot. "+
     "Open this to build one again.",
   hint:"Tap add production",
   done:function(){ return !!document.querySelector(".scrim"); }},

  {tab:"make", keepSheet:1, skip:function(){ return !TUT.ctx.g; },
   sel:function(){ const g=TUT.ctx.g; return g?'.sheet-b [data-act="gadd"][data-id="'+g+'"]':null; },
   t:"Read the ratios, then build",
   d:"Every recipe lists its exact rates. <b>30 iron ingot to 20 iron plate</b> means three smelters "+
     "feed two plate constructors precisely. Tap this one to put your constructor back.",
   hint:"Tap the recipe",
   done:function(){ const g=TUT.ctx.g; return groupCount(g) >= TUT.ctx.c; }},

  {tab:"depot", sel:'[data-tut="inv"]',
   t:"Green good, red bad",
   d:"Each item shows its stock and its <b>net rate</b>. Red means you are consuming it faster than you "+
     "make it. The thin bar is the buffer - when it fills, whatever produces it backs up and stops.",
   hint:"Tap next"},

  {tab:"power", sel:'[data-tut="grid"]',
   t:"Power never trips",
   d:"If draw passes capacity nothing shuts off - <b>every machine slows to the share it can get</b>. "+
     "Burn leaves early, convert them to biomass for triple the energy, then get to coal.",
   hint:"Tap next"},

  {tab:"mine", sel:'[data-act="tap"][data-id="iron_ore"]',
   t:"You can always dig by hand",
   d:"Tap it. Hand-mining will never keep pace with a miner, but it bootstraps you at the start and "+
     "restarts a grid that has run out of fuel.",
   hint:"Tap to mine",
   pre:function(){ TUT.ctx.tap = S.stats.tapped; },
   done:function(){ return S.stats.tapped > TUT.ctx.tap; }},

  {tab:"scan", sel:'[data-tut="sec-rust"]',
   t:"The map starts empty",
   d:"You landed on four deposits. Every other one - and resources you have not seen yet - is found by "+
     "<b>dispatching surveys</b> from here, once you have built a survey station.",
   hint:"Tap next"},

  {tab:"hub", sel:'[data-tut="ms-m_base"]',
   t:"The hub pays for progress",
   d:"Deposit parts here to unlock buildings, recipes and survey range. Delivering an "+
     "<b>elevator phase</b> opens a whole new tier band. This one is your next job.",
   hint:"Tap next"},

  {t:"That is the loop",
   d:"Mine it, smelt it, build it, feed the hub, survey for more. The <b>menu</b> button at the top has "+
     "the details, and a new game, whenever you want them.",
   hint:"Finish"}
];

function tutStart(){
  TUT.on = 1; TUT.i = 0; TUT.t0 = Date.now();
  /* pin the machine the build steps will use up front, so a replay works on
     whatever factory the player already has - or skips those steps entirely */
  const g = firstGroup();
  TUT.ctx = {g:g, c: g ? S.groups[g].c : 0};
  document.body.classList.add("tut");
  closeSheet();
  tutShow();
}
function tutStop(){
  TUT.on = 0;
  document.body.classList.remove("tut");
  tutClear();
  S.tut = 1; save();
  render();
}
function tutClear(){
  const o = document.getElementById("tutLayer");
  if(o) o.remove();
  TUT.els = null;
}
function tutNext(){
  const st = STEPS[TUT.i];
  if(st && !st.keepSheet) closeSheet();
  TUT.i++;
  if(TUT.i >= STEPS.length){ tutStop(); toast("Tour complete - build something"); return; }
  tutShow();
}
function tutShow(){
  while(TUT.i < STEPS.length && STEPS[TUT.i].skip && STEPS[TUT.i].skip()) TUT.i++;
  const st = STEPS[TUT.i];
  if(!st){ tutStop(); return; }
  if(st.tab && TAB !== st.tab){
    TAB = st.tab; syncTabs(); main.scrollTop = 0; render(true);
    const b = document.querySelector('.tab[data-tab="'+st.tab+'"]');
    if(b){ b.classList.add("tut-flash"); setTimeout(function(){ b.classList.remove("tut-flash"); }, 1400); }
  }
  if(st.pre) st.pre();
  tutClear();
  const l = document.createElement("div");
  l.id = "tutLayer";
  l.innerHTML = '<div class="tut-dim" data-d="t"></div><div class="tut-dim" data-d="b"></div>'+
    '<div class="tut-dim" data-d="l"></div><div class="tut-dim" data-d="r"></div>'+
    '<div class="tut-ring pulse" hidden></div>'+
    '<div class="tut-card"><div class="step"><span class="n">'+(TUT.i+1)+' / '+STEPS.length+'</span>'+
    '<span class="track"><i style="width:'+((TUT.i+1)/STEPS.length*100)+'%"></i></span></div>'+
    '<h4>'+st.t+'</h4><p>'+st.d+'</p>'+
    '<div class="acts"><span class="hint'+(st.done?"":" dim")+'">'+(st.hint||"Tap next")+'</span>'+
    '<button class="btn sm ghost" data-act="tutskip">Skip</button>'+
    (st.done ? '' : '<button class="btn sm pri" data-act="tutnext">'+
      (TUT.i === STEPS.length-1 ? "Finish" : "Next")+'</button>')+
    '</div></div>';
  document.body.appendChild(l);
  TUT.stepT = Date.now();
  TUT.els = {
    layer:l,
    dim:{t:l.querySelector('[data-d="t"]'), b:l.querySelector('[data-d="b"]'),
         le:l.querySelector('[data-d="l"]'), r:l.querySelector('[data-d="r"]')},
    ring:l.querySelector(".tut-ring"),
    card:l.querySelector(".tut-card")
  };
  tutPlace();
}
function tutTarget(){
  const st = STEPS[TUT.i];
  if(!st || !st.sel) return null;
  const sel = typeof st.sel === "function" ? st.sel() : st.sel;
  if(!sel) return null;
  return document.querySelector(sel);
}
/* Four dimmers around the target rather than one panel on top of it, so the
   control the step is talking about stays tappable. */
function tutPlace(){
  if(!TUT.on || !TUT.els) return;
  const E = TUT.els, vw = innerWidth, vh = innerHeight, pad = 5;
  const el = tutTarget();
  const px = function(n){ return Math.max(0, Math.round(n))+"px"; };
  if(!el){
    E.ring.hidden = true;
    E.dim.t.style.cssText = "left:0;top:0;width:"+px(vw)+";height:"+px(vh);
    ["b","le","r"].forEach(function(k){ E.dim[k].style.cssText = "width:0;height:0"; });
    E.card.style.left = px((vw - E.card.offsetWidth)/2);
    E.card.style.top  = px((vh - E.card.offsetHeight)/2);
    return;
  }
  const r = el.getBoundingClientRect();
  const T = Math.max(0, r.top - pad), B = Math.min(vh, r.bottom + pad);
  const L = Math.max(0, r.left - pad), R = Math.min(vw, r.right + pad);
  E.ring.hidden = false;
  E.ring.style.cssText = "left:"+px(L)+";top:"+px(T)+";width:"+px(R-L)+";height:"+px(B-T);
  E.dim.t.style.cssText  = "left:0;top:0;width:"+px(vw)+";height:"+px(T);
  E.dim.b.style.cssText  = "left:0;top:"+px(B)+";width:"+px(vw)+";height:"+px(vh-B);
  E.dim.le.style.cssText = "left:0;top:"+px(T)+";width:"+px(L)+";height:"+px(B-T);
  E.dim.r.style.cssText  = "left:"+px(R)+";top:"+px(T)+";width:"+px(vw-R)+";height:"+px(B-T);
  const cw = E.card.offsetWidth, ch = E.card.offsetHeight;
  let top;
  if(B + 10 + ch <= vh - 8) top = B + 10;
  else if(T - 10 - ch >= 8) top = T - 10 - ch;
  else top = Math.max(8, Math.min(vh - ch - 8, 8));
  E.card.style.left = px(Math.max(8, Math.min(vw - cw - 8, r.left + r.width/2 - cw/2)));
  E.card.style.top  = px(top);
}
/* driven from the tick: keeps the spotlight glued to a re-rendered target */
function tutSync(){
  if(!TUT.on) return;
  const st = STEPS[TUT.i];
  if(st && st.done && st.done()){ tutNext(); return; }
  /* nobody should be trapped by a step they cannot satisfy */
  if(st && st.done && TUT.els && Date.now() - TUT.stepT > 12000 &&
     !TUT.els.card.querySelector('[data-act="tutnext"]')){
    const b = document.createElement("button");
    b.className = "btn sm pri"; b.setAttribute("data-act","tutnext"); b.textContent = "Skip step";
    TUT.els.card.querySelector(".acts").appendChild(b);
  }
  tutPlace();
}

/* ============================================================
   BOOT
   ============================================================ */
function start(hot){
  let loaded = null;
  if(hot && hot.save){ try{ loaded = JSON.parse(hot.save); }catch(e){} }
  if(!loaded) loaded = load();
  const fresh = !loaded;
  if(loaded) S = loaded;
  const away = applyOffline();
  advance(1);
  syncTabs(); render(true);
  if(fresh && !S.tut){ tutStart(); return; }
  if(away && away.gained.length && !TUT.on){
    sheet("While you were away",
      '<p>The factory ran for <b>'+dur(away.sec)+'</b> and produced:</p>'+
      '<div class="inv">'+away.gained.map(function(g){
        return '<div class="slot">'+ico(g.id)+'<div class="grow"><div class="nm">'+esc(ITEMS[g.id].n)+'</div>'+
          '<div class="qt">+'+qty(g.d)+'</div></div></div>';
      }).join("")+'</div>'+
      (away.pts > 1 ? '<p>Resource sink banked <b>'+fmt(away.pts)+'</b> points.</p>' : '')+
      (away.found > 0 ? '<p>Surveys returned <b>'+away.found+'</b> new deposit'+(away.found>1?"s":"")+
        '. They are on the Scan tab.</p>' : '')+
      '<p style="color:var(--ink-3);font-size:12px">Offline production runs for up to four hours and stops '+
      'when a generator runs out of fuel.</p>');
  }
  try{
    if(window.claude && window.claude.hot && window.claude.hot.snapshot){
      window.claude.hot.snapshot(function(){ return {save: JSON.stringify(S)}; });
    }
  }catch(e){}
}
try{
  if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
}catch(e){ start({}); }
</script>
