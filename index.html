<title>Pocket Foundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --void:#0d1014;
  --steel:#141920;
  --steel-2:#1b222b;
  --steel-3:#232c37;
  --line:#2b3644;
  --line-hot:#3f4d5f;
  --ink:#e8edf4;
  --ink-2:#95a3b5;
  --ink-3:#66748a;
  --amber:#ff9a3c;
  --amber-deep:#b86a1e;
  --ember:#ff5d3b;
  --volt:#5cc8f5;
  --grow:#78d16b;
  --warn:#ffc94d;
  --hazard:repeating-linear-gradient(135deg, rgba(255,154,60,.10) 0 7px, rgba(255,154,60,0) 7px 14px);
  --chamf:polygon(9px 0, 100% 0, 100% calc(100% - 9px), calc(100% - 9px) 100%, 0 100%, 0 9px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--void);
  color:var(--ink);
  font-family:"Barlow","Helvetica Neue",Arial,sans-serif;
  font-size:15px;
  line-height:1.4;
  height:100dvh;
  overflow:hidden;
  display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:"Chakra Petch",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.10em;font-size:11px;color:var(--ink-3)}

/* ---------- HUD ---------- */
header{
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,var(--steel-2),var(--steel));
  position:relative;
}
header::after{content:"";position:absolute;inset:0;background:var(--hazard);pointer-events:none;opacity:.5}
.hud{max-width:600px;margin:0 auto;padding:8px 14px 9px;position:relative;z-index:1}
.hud-top{display:flex;align-items:center;gap:9px}
.mark{
  width:26px;height:26px;flex:none;background:var(--amber);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  display:grid;place-items:center;color:#12161b;
  font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:14px;
}
.wordmark{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.wordmark small{display:block;font-size:9px;letter-spacing:.2em;color:var(--ink-3);font-weight:500;margin-top:2px}
.hud-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.pill{
  font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.09em;
  text-transform:uppercase;padding:3px 8px;border:1px solid var(--line-hot);color:var(--ink-2);
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px);
  background:var(--steel-3);white-space:nowrap;
}
.pill b{color:var(--amber);font-weight:700}
#menuBtn{width:30px;height:28px;border:1px solid var(--line-hot);background:var(--steel-3);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.5px;
  clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
#menuBtn i{display:block;width:14px;height:2px;background:var(--ink-2)}
#menuBtn:active i{background:var(--amber)}
.menu-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--steel-2);
  border:1px solid var(--line);padding:12px 13px;min-height:52px}
.menu-item:active{border-color:var(--amber)}
.menu-item>span{min-width:0}
.menu-item .k{display:block;font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:14px;letter-spacing:.03em}
.menu-item .v{display:block;font-size:12px;color:var(--ink-3);line-height:1.3;margin-top:2px}
.menu-item .go{margin-left:auto;color:var(--ink-3);font-size:16px}
.menu-item.danger{border-color:rgba(255,93,59,.45)}
.menu-item.danger .k{color:var(--ember)}
.menu-item.danger:active{border-color:var(--ember)}
.menu-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:2px}
.menu-stats>div{background:var(--steel-2);border:1px solid var(--line);padding:7px 9px}
.menu-stats>div .qv{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;
  font-variant-numeric:tabular-nums;margin-top:1px}

/* power meter */
.meter{margin-top:8px}
.meter-row{display:flex;align-items:baseline;gap:8px;font-size:11px}
.meter-row .mono{font-size:12px}
.bar{
  position:relative;height:9px;margin-top:4px;background:#0a0d11;
  border:1px solid var(--line);overflow:hidden;
}
.bar-fill{position:absolute;inset:0 auto 0 0;width:0%;background:var(--volt);transition:width .22s linear}
.bar-fill.stripe{
  background-image:repeating-linear-gradient(115deg,rgba(0,0,0,.22) 0 6px,rgba(0,0,0,0) 6px 12px);
  background-size:200% 100%;animation:crawl 1.1s linear infinite;
}
@keyframes crawl{from{background-position:0 0}to{background-position:-24px 0}}
.bar-cap{position:absolute;top:0;bottom:0;width:2px;background:var(--ink-2);opacity:.7}
body.brownout .bar-fill{background:var(--ember)}
body.brownout header::after{background:repeating-linear-gradient(135deg,rgba(255,93,59,.16) 0 7px,rgba(255,93,59,0) 7px 14px);animation:flash 1.4s ease-in-out infinite}
@keyframes flash{0%,100%{opacity:.35}50%{opacity:.85}}

/* ---------- main ---------- */
main{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap{max-width:600px;margin:0 auto;padding:14px;padding-block:14px 26px;display:flex;flex-direction:column;gap:14px}

.sec{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;align-items:center;gap:8px}
.sec-head h2{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:13px;letter-spacing:.13em;
  text-transform:uppercase;margin:0;color:var(--ink)}
.sec-head .rule{flex:1;height:1px;background:var(--line)}
.sec-head .note{font-size:11px;color:var(--ink-3)}

.card{background:var(--steel);border:1px solid var(--line);clip-path:var(--chamf);padding:11px 12px}
.card.tight{padding:9px 11px}
.card.lit{border-color:var(--line-hot);background:var(--steel-2)}

.row{display:flex;align-items:center;gap:9px}
.grow{flex:1;min-width:0}
.ttl{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:14.5px;letter-spacing:.02em;line-height:1.15}
.sub{font-size:11.5px;color:var(--ink-3);line-height:1.3}

/* item icon */
.ico{width:20px;height:20px;flex:none;display:block;background:var(--c,#888)}
.ico.raw{border-radius:50%}
.ico.ingot{border-radius:3px;height:13px;margin-block:3px}
.ico.part{clip-path:polygon(5px 0,100% 0,100% calc(100% - 5px),calc(100% - 5px) 100%,0 100%,0 5px)}
.ico.fluid{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.ico.proj{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.ico.sm{width:14px;height:14px}
.ico.sm.ingot{height:9px;margin-block:2.5px}

.chip{display:inline-flex;align-items:center;gap:5px;background:var(--steel-3);border:1px solid var(--line);
  padding:3px 7px 3px 4px;font-size:12px;white-space:nowrap}
.chip .mono{font-size:12px}
.chip.bad{border-color:rgba(255,93,59,.55)}
.chip.bad .mono{color:var(--ember)}

/* buttons */
.btn{
  font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
  padding:8px 12px;background:var(--steel-3);border:1px solid var(--line-hot);color:var(--ink);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
  min-height:38px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{background:var(--line)}
.btn.pri{background:var(--amber);color:#12161b;border-color:var(--amber)}
.btn.pri:active{background:var(--amber-deep)}
.btn.sm{padding:5px 9px;min-height:30px;font-size:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent}
.stepper{display:flex;align-items:stretch;border:1px solid var(--line-hot);background:var(--steel-3)}
.stepper button{width:38px;min-height:36px;display:grid;place-items:center;font-family:"Chakra Petch",sans-serif;
  font-weight:700;font-size:17px;color:var(--ink)}
.stepper button:disabled{opacity:.3}
.stepper .val{min-width:42px;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-weight:700;
  font-size:15px;border-inline:1px solid var(--line-hot);font-variant-numeric:tabular-nums}

/* status */
.stat{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 6px;border:1px solid;white-space:nowrap}
.st-run{color:var(--grow);border-color:rgba(120,209,107,.5);background:rgba(120,209,107,.09)}
.st-star{color:var(--warn);border-color:rgba(255,201,77,.5);background:rgba(255,201,77,.09)}
.st-full{color:var(--volt);border-color:rgba(92,200,245,.45);background:rgba(92,200,245,.09)}
.st-pow{color:var(--ember);border-color:rgba(255,93,59,.5);background:rgba(255,93,59,.09)}
.st-off{color:var(--ink-3);border-color:var(--line)}

.thru{height:4px;background:#0a0d11;border:1px solid var(--line);margin-top:8px;position:relative;overflow:hidden}
.thru i{position:absolute;inset:0 auto 0 0;background:var(--grow);width:0%;transition:width .25s linear;display:block}
.thru i.belt{background-image:repeating-linear-gradient(115deg,rgba(0,0,0,.3) 0 5px,rgba(0,0,0,0) 5px 10px);
  background-size:200% 100%;animation:crawl 1s linear infinite}
.thru i.warn{background:var(--warn)}
.thru i.bad{background:var(--ember)}

/* progress */
.prog{height:7px;background:#0a0d11;border:1px solid var(--line);position:relative;overflow:hidden;margin-top:5px}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--amber);width:0%;display:block;transition:width .3s ease}
.prog i.done{background:var(--grow)}

/* inventory grid */
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px}
.slot{background:var(--steel);border:1px solid var(--line);padding:7px 8px;display:flex;gap:7px;align-items:flex-start}
.slot .nm{font-size:11.5px;line-height:1.2;color:var(--ink-2)}
.slot .qt{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;line-height:1.2}
.slot .rt{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-variant-numeric:tabular-nums}
.rt.up{color:var(--grow)} .rt.dn{color:var(--ember)} .rt.flat{color:var(--ink-3)}
.capbar{height:3px;background:#0a0d11;margin-top:4px;position:relative}
.capbar i{position:absolute;inset:0 auto 0 0;background:var(--line-hot);display:block}
.capbar i.max{background:var(--volt)}

/* node cards */
.pur{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 5px;border:1px solid}
.pur.impure{color:var(--ink-3);border-color:var(--line)}
.pur.normal{color:var(--volt);border-color:rgba(92,200,245,.45)}
.pur.pure{color:var(--amber);border-color:rgba(255,154,60,.5);background:rgba(255,154,60,.08)}

/* clock slider */
.clock{display:flex;align-items:center;gap:9px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:22px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line-hot)}
input[type=range]::-moz-range-track{height:4px;background:var(--line-hot)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--amber);
  margin-top:-8px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:none;background:var(--amber);
  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
select{font:inherit;font-size:13px;background:var(--steel-3);color:var(--ink);border:1px solid var(--line-hot);
  padding:7px 9px;min-height:36px;max-width:100%}

/* costs */
.costs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.cost{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 6px 2px 3px;
  border:1px solid var(--line);background:var(--steel-2)}
.cost.no{border-color:rgba(255,93,59,.5)}
.cost.no .mono{color:var(--ember)}
.cost .mono{font-size:11.5px}

/* nav */
nav{border-top:1px solid var(--line);background:var(--steel-2);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-3);
  border-top:2px solid transparent;position:relative}
.tab span{font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase}
.tab .g{width:17px;height:17px;background:currentColor}
.tab[aria-selected="true"]{color:var(--amber);border-top-color:var(--amber);background:rgba(255,154,60,.06)}
.tab .dot{position:absolute;top:5px;right:calc(50% - 18px);width:6px;height:6px;background:var(--amber);border-radius:50%}
.g-hub{clip-path:polygon(50% 0,100% 30%,100% 70%,50% 100%,0 70%,0 30%)}
.g-mine{clip-path:polygon(0 100%,28% 44%,58% 74%,100% 12%,100% 0,72% 0,50% 46%,26% 22%,0 74%)}
.g-make{clip-path:polygon(0 100%,0 42%,26% 42%,26% 20%,52% 42%,52% 20%,78% 42%,78% 0,100% 0,100% 100%)}
.g-pow{clip-path:polygon(58% 0,10% 56%,44% 56%,34% 100%,90% 40%,54% 40%)}
.g-dep{clip-path:polygon(0 22%,50% 0,100% 22%,100% 100%,0 100%)}
.g-scan{clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,7,9,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:86dvh;background:var(--steel);border:1px solid var(--line-hot);
  border-bottom:none;display:flex;flex-direction:column;overflow:hidden}
.sheet-h{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line);
  background:var(--steel-2);flex:none}
.sheet-h h3{margin:0;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:14px;letter-spacing:.1em;
  text-transform:uppercase}
.sheet-b{overflow-y:auto;padding:12px 14px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:9px;overscroll-behavior:contain}
.sheet-b p{margin:0;font-size:13.5px;color:var(--ink-2)}
.sheet-b p b{color:var(--ink);font-weight:600}
.pick{width:100%;text-align:left;background:var(--steel-2);border:1px solid var(--line);padding:9px 10px}
.pick:active{border-color:var(--amber)}
.pick[disabled]{opacity:.4}
.flow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px}
.arrow{color:var(--ink-3);font-size:12px;margin-inline:1px}

/* ---- guided tour ---- */
.tut-dim{position:fixed;background:rgba(6,8,11,.80);z-index:70}
.tut-ring{position:fixed;z-index:71;pointer-events:none;border:2px solid var(--amber);
  box-shadow:0 0 0 3px rgba(255,154,60,.18),0 0 22px rgba(255,154,60,.30)}
.tut-ring.pulse{animation:tutpulse 1.6s ease-in-out infinite}
@keyframes tutpulse{0%,100%{box-shadow:0 0 0 3px rgba(255,154,60,.16),0 0 18px rgba(255,154,60,.22)}
  50%{box-shadow:0 0 0 6px rgba(255,154,60,.28),0 0 30px rgba(255,154,60,.44)}}
.tut-card{position:fixed;z-index:72;width:min(364px,calc(100vw - 28px));background:var(--steel-2);
  border:1px solid var(--line-hot);padding:13px 14px 12px;
  clip-path:polygon(11px 0,100% 0,100% calc(100% - 11px),calc(100% - 11px) 100%,0 100%,0 11px)}
.tut-card .step{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.tut-card .step .n{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--amber);
  letter-spacing:.06em;font-variant-numeric:tabular-nums}
.tut-card .step .track{flex:1;height:2px;background:var(--line);position:relative}
.tut-card .step .track i{position:absolute;inset:0 auto 0 0;background:var(--amber);display:block;transition:width .3s ease}
.tut-card h4{margin:0 0 4px;font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.02em;text-wrap:balance}
.tut-card p{margin:0;font-size:13.5px;line-height:1.42;color:var(--ink-2)}
.tut-card p b{color:var(--ink);font-weight:600}
.tut-card .acts{display:flex;align-items:center;gap:8px;margin-top:11px}
.tut-card .hint{flex:1;font-family:"Chakra Petch",sans-serif;font-weight:600;font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--amber)}
.tut-card .hint.dim{color:var(--ink-3)}
.tab.tut-flash{background:rgba(255,154,60,.22)}
body.tut .toast{bottom:auto;top:14px}

.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--steel-3);border:1px solid var(--line-hot);color:var(--ink);padding:8px 14px;font-size:13px;
  z-index:60;pointer-events:none;max-width:88vw;text-align:center;
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.toast.bad{border-color:rgba(255,93,59,.6);color:var(--ember)}

.empty{color:var(--ink-3);font-size:13px;padding:14px;border:1px dashed var(--line);text-align:center}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:10.5px;font-family:"Chakra Petch",sans-serif;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--volt);border:1px solid rgba(92,200,245,.35);padding:1px 5px;background:rgba(92,200,245,.07)}
.tag.g{color:var(--grow);border-color:rgba(120,209,107,.35);background:rgba(120,209,107,.07)}
hr.dash{border:none;border-top:1px dashed var(--line);margin:9px 0 0}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>

<header>
  <div class="hud">
    <div class="hud-top">
      <div class="mark">A</div>
      <div class="wordmark">Pocket Foundry<small id="hudSub">Arclight Industries</small></div>
      <div class="hud-right">
        <div class="pill">Tier <b id="hudTier">1</b></div>
        <button id="menuBtn" aria-label="Game menu"><i></i><i></i><i></i></button>
      </div>
    </div>
    <div class="meter">
      <div class="meter-row">
        <span class="lbl">Grid</span>
        <span class="mono" id="hudPow">0 / 0 MW</span>
        <span class="grow"></span>
        <span class="stat st-run" id="hudState">Nominal</span>
      </div>
      <div class="bar"><i class="bar-fill" id="hudBar"></i><i class="bar-cap" id="hudCap" style="left:100%"></i></div>
    </div>
  </div>
</header>

<main id="main"><div class="wrap" id="view"></div></main>

<nav>
  <div class="navin" role="tablist">
    <button class="tab" role="tab" data-tab="hub"   aria-selected="true"><i class="g g-hub"></i><span>Hub</span></button>
    <button class="tab" role="tab" data-tab="mine"  aria-selected="false"><i class="g g-mine"></i><span>Mine</span></button>
    <button class="tab" role="tab" data-tab="make"  aria-selected="false"><i class="g g-make"></i><span>Make</span></button>
    <button class="tab" role="tab" data-tab="scan"  aria-selected="false"><i class="g g-scan"></i><span>Scan</span></button>
    <button class="tab" role="tab" data-tab="power" aria-selected="false"><i class="g g-pow"></i><span>Power</span></button>
    <button class="tab" role="tab" data-tab="depot" aria-selected="false"><i class="g g-dep"></i><span>Depot</span></button>
  </div>
</nav>

<script>
"use strict";
/* ============================================================
   POCKET FOUNDRY - factory sim
   All machine rates are expressed per minute and derived from
   (quantity * 60 / cycleSeconds), so recipe ratios stay exact.
